<div class="content">


<div class="card">


<h2>🔔 Create Notification</h2>


<label>
Notification Type
</label>


<select id="notificationType">

<option>
Customer
</option>

<option>
Sales
</option>

<option>
Inventory
</option>

<option>
Purchase
</option>

<option>
Task
</option>

<option>
General
</option>

</select>



<label>
Notification Message
</label>


<textarea
id="notificationMessage"
placeholder="Enter notification message"></textarea>



<br><br>


<button id="saveNotification">

💾 Save Notification

  </button>
  <div class="card">


<h2>📊 Notification Summary</h2>


<p>

Total Notifications:

<b id="totalNotifications">
0
</b>

</p>


</div>




<div class="card">


<h2>📚 Notification History</h2>


<div id="notificationList">


<p>
No notifications available.
</p>


</div>


</div>


</div>


  </div>
  <script>


const saveNotification =
document.getElementById("saveNotification");


const notificationList =
document.getElementById("notificationList");



function loadNotifications(){


let notifications =
JSON.parse(localStorage.getItem("notifications")) || [];



document.getElementById("totalNotifications").innerHTML =
notifications.length;



if(notifications.length === 0){


notificationList.innerHTML =
"<p>No notifications available.</p>";

return;

}



notificationList.innerHTML = "";



notifications.reverse().forEach(function(notification){


notificationList.innerHTML += `

<div class="card">


<h3>🔔 ${notification.type}</h3>


<p>
${notification.message}
</p>


<small>
${notification.date}
</small>


</div>

`;

});


}



saveNotification.onclick = function(){



let notification = {


type:
document.getElementById("notificationType").value,


message:
document.getElementById("notificationMessage").value.trim(),


date:
new Date().toLocaleString()


};



if(notification.message === ""){


alert("Please enter notification message.");

return;

}



let notifications =
JSON.parse(localStorage.getItem("notifications")) || [];



notifications.push(notification);



localStorage.setItem(
"notifications",
JSON.stringify(notifications)
);



alert("Notification saved successfully!");



loadNotifications();



};



window.onload =
loadNotifications;


</script>


<script src="script.js"></script>
