<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>NexaFlow AI - Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#f4f7fb;
}

.auth-container{
width:100%;
max-width:450px;
background:white;
padding:35px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.logo{
text-align:center;
font-size:28px;
font-weight:bold;
color:#0b1f3a;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:30px;
}

.tabs{
display:flex;
margin-bottom:25px;
}

.tabs button{
flex:1;
padding:12px;
border:none;
cursor:pointer;
background:#eee;
font-size:16px;
}

.tabs button.active{
background:#0066ff;
color:white;
}

.form-group{
margin-bottom:15px;
}

label{
display:block;
font-weight:bold;
margin-bottom:6px;
}

input{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
}

.auth-btn{
width:100%;
padding:13px;
background:#0066ff;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

.auth-btn:hover{
background:#004ccc;
}

.message{
margin-top:15px;
text-align:center;
font-weight:bold;
}

.hidden{
display:none;
}

</style>

</head>

<body>

<div class="auth-container">

<div class="logo">
NexaFlow AI
</div>

<div class="subtitle">
Business Management Platform
</div>

<div class="tabs">

<button
id="loginTab"
class="active"
onclick="showLogin()">

Login

</button>

<button
id="registerTab"
onclick="showRegister()">

Create Account

</button>

</div>


<!-- ===============================
     LOGIN FORM
================================ -->

<div id="loginForm">

<div class="form-group">

<label>
Email
</label>

<input
type="email"
id="loginEmail"
placeholder="Enter email">

</div>

<div class="form-group">

<label>
Password
</label>

<input
type="password"
id="loginPassword"
placeholder="Enter password">

</div>

<button
class="auth-btn"
onclick="loginUser()">

Login

</button>

</div>


<!-- ===============================
     REGISTER FORM
================================ -->

<div
id="registerForm"
class="hidden">

<div class="form-group">

<label>
Owner Name
</label>

<input
type="text"
id="ownerName"
placeholder="Enter owner name">

</div>

<div class="form-group">

<label>
Business Name
</label>

<input
type="text"
id="businessName"
placeholder="Enter business name">

</div>

<div class="form-group">

<label>
Phone Number
</label>

<input
type="text"
id="phone"
placeholder="Enter phone number">

</div>

<div class="form-group">

<label>
Email
</label>

<input
type="email"
id="registerEmail"
placeholder="Enter email">

</div>

<div class="form-group">

<label>
Password
</label>

<input
type="password"
id="registerPassword"
placeholder="Create password">

</div>

<button
class="auth-btn"
onclick="registerUser()">

Create Account

</button>

</div>


<div
id="message"
class="message">
</div>

</div>


<script>

/* ==================================================
   SUPABASE CONFIGURATION
================================================== */

const SUPABASE_URL =
"https://xfjroysinifwncfjvrsg.supabase.co";


/*
IMPORTANT:
This is the correct ANON PUBLIC key.
Do NOT put the Supabase service-role secret key here.
*/

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhmanJveXNpbmlmd25jZmp2cnNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyNTU3NDAsImV4cCI6MjA5OTgzMTc0MH0.wxKe_cs9n78YhF5nw63crh3pxNnkQW7VGjcqzv3adPs";


/* ==================================================
   SHOW LOGIN
================================================== */

function showLogin(){

document.getElementById("loginForm")
.style.display="block";

document.getElementById("registerForm")
.style.display="none";

document.getElementById("loginTab")
.classList.add("active");

document.getElementById("registerTab")
.classList.remove("active");

}


/* ==================================================
   SHOW REGISTER
================================================== */

function showRegister(){

document.getElementById("loginForm")
.style.display="none";

document.getElementById("registerForm")
.style.display="block";

document.getElementById("registerTab")
.classList.add("active");

document.getElementById("loginTab")
.classList.remove("active");

}


/* ==================================================
   REGISTER USER
================================================== */

async function registerUser(){

const ownerName =
document.getElementById("ownerName")
.value.trim();

const businessName =
document.getElementById("businessName")
.value.trim();

const phone =
document.getElementById("phone")
.value.trim();

const email =
document.getElementById("registerEmail")
.value.trim();

const password =
document.getElementById("registerPassword")
.value;

const message =
document.getElementById("message");


if(
!ownerName ||
!businessName ||
!email ||
!password
){

message.innerHTML =
"❌ Please complete all required fields.";

return;

}


if(password.length < 6){

message.innerHTML =
"❌ Password must contain at least 6 characters.";

return;

}


message.innerHTML =
"Creating account...";


try{

const response =
await fetch(

SUPABASE_URL +
"/auth/v1/signup",

{

method:"POST",

headers:{

"apikey":
SUPABASE_ANON_KEY,

"Content-Type":
"application/json"

},

body:JSON.stringify({

email:email,

password:password

})

}

);


const result =
await response.json();


console.log(
"Supabase registration response:",
result
);


if(!response.ok){

message.innerHTML =
"❌ " +
(
result.message ||
result.msg ||
"Registration failed."
);

return;

}


/*
Save business information temporarily.
*/

localStorage.setItem(

"pending_business_profile",

JSON.stringify({

business_name:
businessName,

owner_name:
ownerName,

phone:
phone

})

);


message.innerHTML =
"✅ Account created successfully. " +
"Please verify your email, then log in.";


setTimeout(function(){

showLogin();

},2000);


}catch(error){

console.error(error);

message.innerHTML =
"❌ Connection error.";

}

}


/* ==================================================
   LOGIN USER
================================================== */

async function loginUser(){

const email =
document.getElementById("loginEmail")
.value.trim();

const password =
document.getElementById("loginPassword")
.value;

const message =
document.getElementById("message");


if(!email || !password){

message.innerHTML =
"❌ Enter your email and password.";

return;

}


message.innerHTML =
"Logging in...";


try{

const response =
await fetch(

SUPABASE_URL +
"/auth/v1/token?grant_type=password",

{

method:"POST",

headers:{

"apikey":
SUPABASE_ANON_KEY,

"Content-Type":
"application/json"

},

body:JSON.stringify({

email:email,

password:password

})

}

);


const result =
await response.json();


console.log(
"Supabase login response:",
result
);


if(!response.ok){

const errorMessage =
result.message ||
result.error_description ||
result.error ||
result.msg ||
"Login failed.";

message.innerHTML =
"❌ " + errorMessage;

return;

}


/* ==================================================
   VERIFY ACCESS TOKEN
================================================== */

if(!result.access_token){

message.innerHTML =
"❌ Login succeeded, but access token was not returned.";

return;

}


/* ==================================================
   CLEAR OLD SESSION
================================================== */

localStorage.removeItem("access_token");
localStorage.removeItem("refresh_token");
localStorage.removeItem("user_id");


/* ==================================================
   SAVE NEW SESSION
================================================== */

localStorage.setItem(
"access_token",
result.access_token
);


if(result.refresh_token){

localStorage.setItem(
"refresh_token",
result.refresh_token
);

}


/* ==================================================
   GET USER UUID
================================================== */

const userId =
result.user &&
result.user.id
? result.user.id
: null;


if(!userId){

message.innerHTML =
"❌ Login succeeded, but user ID was not returned.";

return;

}


localStorage.setItem(
"user_id",
userId
);


/* ==================================================
   SAVE BUSINESS ACCOUNT
================================================== */

const pendingProfile =
localStorage.getItem(
"pending_business_profile"
);


if(pendingProfile){

let profile = null;


try{

profile =
JSON.parse(
pendingProfile
);

}catch(error){

console.error(
"Invalid pending business profile:",
error
);

localStorage.removeItem(
"pending_business_profile"
);

}


if(profile){

try{

const businessResponse =
await fetch(

SUPABASE_URL +
"/rest/v1/business_accounts",

{

method:"POST",

headers:{

"apikey":
SUPABASE_ANON_KEY,

"Authorization":
"Bearer " +
result.access_token,

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

},

body:JSON.stringify({

user_id:
userId,

business_name:
profile.business_name,

owner_name:
profile.owner_name,

phone:
profile.phone

})

}

);


if(businessResponse.ok){

localStorage.removeItem(
"pending_business_profile"
);

}else{

const errorText =
await businessResponse.text();


console.error(
"Business account response:",
errorText
);


/*
If the business account already exists,
do not destroy the valid login session.
*/

if(
!errorText.toLowerCase().includes("duplicate") &&
!errorText.toLowerCase().includes("already exists") &&
!errorText.toLowerCase().includes("23505")
){

console.warn(
"Business profile was not saved:",
errorText
);

}

}

}catch(error){

console.error(
"Business account connection error:",
error
);

}

}

}


/* ==================================================
   LOGIN SUCCESS
================================================== */

message.innerHTML =
"✅ Login successful";


setTimeout(function(){

window.location.href =
"dashboard.html";

},800);


}catch(error){

console.error(
"Login connection error:",
error
);

message.innerHTML =
"❌ Connection error.";

}

}

</script>

</body>

     </html>
