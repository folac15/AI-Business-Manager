<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>NexaFlow AI - Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#f4f7fb;
}

.auth-container{
width:100%;
max-width:450px;
background:white;
padding:35px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.logo{
text-align:center;
font-size:28px;
font-weight:bold;
color:#0b1f3a;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:30px;
}

.tabs{
display:flex;
margin-bottom:25px;
}

.tabs button{
flex:1;
padding:12px;
border:none;
cursor:pointer;
background:#eee;
font-size:16px;
}

.tabs button.active{
background:#0066ff;
color:white;
}

.form-group{
margin-bottom:15px;
}

label{
display:block;
font-weight:bold;
margin-bottom:6px;
}

input{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
}

.auth-btn{
width:100%;
padding:13px;
background:#0066ff;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

.auth-btn:hover{
background:#004ccc;
}

.message{
margin-top:15px;
text-align:center;
font-weight:bold;
}

.hidden{
display:none;
}

</style>

</head>

<body>

<div class="auth-container">

<div class="logo">
NexaFlow AI
</div>

<div class="subtitle">
Business Management Platform
</div>

<div class="tabs">

<button
id="loginTab"
class="active"
onclick="showLogin()">
Login
</button>

<button
id="registerTab"
onclick="showRegister()">
Create Account
</button>

</div>


<!-- LOGIN -->

<div id="loginForm">

<div class="form-group">

<label>Email</label>

<input
type="email"
id="loginEmail"
placeholder="Enter email">

</div>


<div class="form-group">

<label>Password</label>

<input
type="password"
id="loginPassword"
placeholder="Enter password">

</div>


<button
class="auth-btn"
onclick="loginUser()">

Login

</button>

</div>


<!-- REGISTER -->

<div id="registerForm"
class="hidden">

<div class="form-group">

<label>Owner Name</label>

<input
type="text"
id="ownerName"
placeholder="Enter owner name">

</div>


<div class="form-group">

<label>Business Name</label>

<input
type="text"
id="businessName"
placeholder="Enter business name">

</div>


<div class="form-group">

<label>Phone Number</label>

<input
type="text"
id="phone"
placeholder="Enter phone number">

</div>


<div class="form-group">

<label>Email</label>

<input
type="email"
id="registerEmail"
placeholder="Enter email">

</div>


<div class="form-group">

<label>Password</label>

<input
type="password"
id="registerPassword"
placeholder="Create password">

</div>


<button
class="auth-btn"
onclick="registerUser()">

Create Account

</button>

</div>


<div
id="message"
class="message">
</div>

</div>


<script>

const SUPABASE_URL =
"https://xfjroysinifwncfjvrsg.supabase.co";


const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmxlIiwicmVmIjoieGZqcm95c2luaWZ3bmNmanZyc2ciLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4NDI1NTc0MCwiZXhwIjoyMDk5ODMxNzQwfQ.wxKe_cs9n78YhF5nw63crh3pxNnkQW7VGjcqzv3adPs";


function showLogin(){

document.getElementById(
"loginForm"
).style.display="block";

document.getElementById(
"registerForm"
).style.display="none";

document.getElementById(
"loginTab"
).classList.add("active");

document.getElementById(
"registerTab"
).classList.remove("active");

}


function showRegister(){

document.getElementById(
"loginForm"
).style.display="none";

document.getElementById(
"registerForm"
).style.display="block";

document.getElementById(
"registerTab"
).classList.add("active");

document.getElementById(
"loginTab"
).classList.remove("active");

}


/* ==================================================
   REGISTER
================================================== */

async function registerUser(){

const email =
document.getElementById(
"registerEmail"
).value.trim();

const password =
document.getElementById(
"registerPassword"
).value;

const message =
document.getElementById(
"message"
);


if(!email || !password){

message.innerHTML=
"Please enter email and password.";

return;

}


try{

const response =
await fetch(

SUPABASE_URL +
"/auth/v1/signup",

{

method:"POST",

headers:{

"apikey":
SUPABASE_ANON_KEY,

"Content-Type":
"application/json"

},

body:JSON.stringify({

email:email,

password:password

})

}

);


const result =
await response.json();


if(response.ok){

message.innerHTML=
"✅ Account created successfully. Check your email for verification.";

}else{

message.innerHTML=
"❌ " +
(
result.msg ||
result.message ||
"Unable to create account."
);

}

}catch(error){

console.error(error);

message.innerHTML=
"❌ Connection error.";

}

}


/* ==================================================
   LOGIN
================================================== */

async function loginUser(){

const email =
document.getElementById(
"loginEmail"
).value.trim();

const password =
document.getElementById(
"loginPassword"
).value;

const message =
document.getElementById(
"message"
);


if(!email || !password){

message.innerHTML=
"Please enter email and password.";

return;

}


message.innerHTML=
"Logging in...";


try{

const response =
await fetch(

SUPABASE_URL +
"/auth/v1/token?grant_type=password",

{

method:"POST",

headers:{

"apikey":
SUPABASE_ANON_KEY,

"Content-Type":
"application/json"

},

body:JSON.stringify({

email:email,

password:password

})

}

);


const result =
await response.json();


console.log(
"Supabase login response:",
result
);


if(response.ok && result.access_token){

/*
IMPORTANT:
Save BOTH tokens.
*/

localStorage.setItem(
"access_token",
result.access_token
);


if(result.refresh_token){

localStorage.setItem(
"refresh_token",
result.refresh_token
);

}


/*
Save user ID if Supabase
returned the user.
*/

if(result.user && result.user.id){

localStorage.setItem(
"user_id",
result.user.id
);

}


message.innerHTML=
"✅ Login successful";


setTimeout(function(){

window.location.href=
"dashboard.html";

},700);


}else{

message.innerHTML=
"❌ " +
(
result.error_description ||
result.msg ||
result.message ||
"Login failed."
);

}

}catch(error){

console.error(error);

message.innerHTML=
"❌ Connection error.";

}

}

</script>

</body>

                   </html>
