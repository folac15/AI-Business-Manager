<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NexaFlow AI - Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#f4f7fb;

}


.auth-container{

width:100%;
max-width:450px;
background:white;
padding:35px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);

}


.logo{

text-align:center;
font-size:28px;
font-weight:bold;
color:#0b1f3a;
margin-bottom:10px;

}


.subtitle{

text-align:center;
color:#666;
margin-bottom:30px;

}


.tabs{

display:flex;
margin-bottom:25px;

}


.tabs button{

flex:1;
padding:12px;
border:none;
cursor:pointer;
background:#eee;
font-size:16px;

}


.tabs button.active{

background:#0066ff;
color:white;

}


.form-group{

margin-bottom:15px;

}


label{

display:block;
font-weight:bold;
margin-bottom:6px;

}


input{

width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;

}


.auth-btn{

width:100%;
padding:13px;
background:#0066ff;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
margin-top:10px;

}


.auth-btn:hover{

background:#004ccc;

}


.message{

margin-top:15px;
text-align:center;
font-weight:bold;

}


.hidden{

display:none;

}


</style>

  </head>
  <body>


<div class="auth-container">


<div class="logo">
NexaFlow AI
</div>


<div class="subtitle">
Business Management Platform
</div>



<div class="tabs">

<button 
id="loginTab"
class="active"
onclick="showLogin()">

Login

</button>


<button 
id="registerTab"
onclick="showRegister()">

Create Account

</button>


</div>





<!-- LOGIN FORM -->

<div id="loginForm">


<div class="form-group">

<label>
Email
</label>

<input 
type="email"
id="loginEmail"
placeholder="Enter email">

</div>



<div class="form-group">

<label>
Password
</label>

<input 
type="password"
id="loginPassword"
placeholder="Enter password">

</div>



<button 
class="auth-btn"
onclick="loginUser()">

Login

</button>


</div>





<!-- REGISTER FORM -->

<div id="registerForm" class="hidden">



<div class="form-group">

<label>
Owner Name
</label>

<input 
type="text"
id="ownerName"
placeholder="Enter owner name">

</div>




<div class="form-group">

<label>
Business Name
</label>

<input 
type="text"
id="businessName"
placeholder="Enter business name">

</div>





<div class="form-group">

<label>
Phone Number
</label>

<input 
type="text"
id="phone"
placeholder="Enter phone number">

</div>





<div class="form-group">

<label>
Email
</label>

<input 
type="email"
id="registerEmail"
placeholder="Enter email">

</div>





<div class="form-group">

<label>
Password
</label>

<input 
type="password"
id="registerPassword"
placeholder="Create password">

</div>





<button
class="auth-btn"
onclick="registerUser()">

Create Account

</button>


</div>





<div 
id="message"
class="message">

</div>



  </div>
    <script>

const SUPABASE_URL =
"https://xfjroysinifwncfjvrsg.supabase.co";


const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhmanJveXNpbmlmd25jZmp2cnNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyNTU3NDAsImV4cCI6MjA5OTgzMTc0MH0.wxKe_cs9n78YhF5nw63crh3pxNnkQW7VGjcqzv3adPs";



function showLogin(){

document.getElementById("loginForm").style.display="block";

document.getElementById("registerForm").style.display="none";


document.getElementById("loginTab").classList.add("active");

document.getElementById("registerTab").classList.remove("active");

}




function showRegister(){

document.getElementById("loginForm").style.display="none";

document.getElementById("registerForm").style.display="block";


document.getElementById("registerTab").classList.add("active");

document.getElementById("loginTab").classList.remove("active");

}





async function registerUser(){


let email =
document.getElementById("registerEmail").value;


let password =
document.getElementById("registerPassword").value;


let message =
document.getElementById("message");



try{


let response = await fetch(

SUPABASE_URL + "/auth/v1/signup",

{

method:"POST",

headers:{

"apikey":SUPABASE_ANON_KEY,

"Content-Type":"application/json"

},

body:JSON.stringify({

email:email,

password:password

})

}

);



let result = await response.json();



if(response.ok){

message.innerHTML =
"✅ Account created successfully. Check email if verification is required.";

}else{

message.innerHTML =
"❌ " + result.message;

}



}catch(error){

message.innerHTML =
"❌ Connection error";

}



}






async function loginUser(){


let email =
document.getElementById("loginEmail").value;


let password =
document.getElementById("loginPassword").value;


let message =
document.getElementById("message");



try{


let response = await fetch(

SUPABASE_URL + "/auth/v1/token?grant_type=password",

{

method:"POST",

headers:{

"apikey":SUPABASE_ANON_KEY,

"Content-Type":"application/json"

},

body:JSON.stringify({

email:email,

password:password

})

}

);



let result = await response.json();



if(response.ok){


localStorage.setItem(
"access_token",
result.access_token
);


message.innerHTML =
"✅ Login successful";


setTimeout(function(){

window.location.href="dashboard.html";

},1000);



}else{


message.innerHTML =
"❌ " + result.message;


}



}catch(error){


message.innerHTML =
"❌ Connection error";


}


}


</script>


</body>

</html>
