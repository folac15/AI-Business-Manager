<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Settings</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
display:flex;
background:#f4f7fb;
min-height:100vh;
}

/* SIDEBAR */

.sidebar{
width:250px;
background:#0b1f3a;
color:white;
padding:25px;
}

.logo{
font-size:22px;
font-weight:bold;
margin-bottom:30px;
}

.business-logo{
width:70px;
height:70px;
background:white;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
color:#0b1f3a;
margin-bottom:15px;
}

.sidebar a{
display:block;
color:white;
text-decoration:none;
padding:12px;
margin-bottom:8px;
border-radius:8px;
}

.sidebar a:hover{
background:#0066ff;
}

/* MAIN */

.main{
flex:1;
padding:30px;
}

.header{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:30px;
}

.settings-box{
background:white;
padding:25px;
border-radius:12px;
max-width:800px;
box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.settings-box h3{
margin-bottom:20px;
}

label{
font-weight:bold;
display:block;
margin-top:15px;
}

input,
textarea{
width:100%;
padding:12px;
margin-top:8px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
}

textarea{
height:120px;
resize:none;
}

.logo-preview{
width:100px;
height:100px;
background:#f4f7fb;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:45px;
margin-bottom:20px;
}

button{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:8px;
background:#0066ff;
color:white;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#004ccc;
}

#saveMessage{
margin-top:20px;
font-weight:bold;
}

@media(max-width:800px){

body{
display:flex;
}

.sidebar{
width:85px;
padding:12px;
}

.logo{
font-size:16px;
}

.business-logo{
width:45px;
height:45px;
font-size:20px;
}

.sidebar h3{
display:none;
}

.sidebar a{
font-size:12px;
padding:8px;
}

.main{
padding:15px;
}

}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">
NexaFlow AI
</div>

<div class="business-logo">
🏢
</div>

<h3>Your Business</h3>

<br>

<a href="dashboard.html">Dashboard</a>
<a href="ai-assistant.html">AI Assistant</a>
<a href="customers.html">Customers</a>
<a href="analytics.html">Analytics</a>
<a href="automation.html">Automation</a>
<a href="reports.html">Reports</a>
<a href="settings.html">Settings</a>

</div>

<div class="main">

<div class="header">

<h2>⚙ Business Settings</h2>

<p>Manage your business profile and branding.</p>

</div>

<div class="settings-box">

<div class="logo-preview">

<img id="logoPreview"
src="https://via.placeholder.com/100"
style="width:100px;height:100px;border-radius:50%;object-fit:cover;">

</div>


<label>
Business Logo
</label>

<input 
type="file"
id="logoFile"
accept="image/*"
onchange="previewLogo(event)">

<h3>Business Profile</h3>

<label>Business Name</label>
<input type="text" id="businessName">

<label>Phone Number</label>
<input type="text" id="businessPhone">

<label>Email Address</label>
<input type="email" id="businessEmail">

<label>Business Address</label>
<input type="text" id="businessAddress">

<label>Business Description</label>
<textarea id="businessDescription"></textarea>

<button onclick="saveSettings()">
Save Settings
</button>

<div id="saveMessage"></div>
<script>
  function previewLogo(event){

const file = event.target.files[0];

if(file){

const reader = new FileReader();


reader.onload=function(){

document.getElementById("logoPreview").src =
reader.result;

}


reader.readAsDataURL(file);

}

  }

async function saveSettings(){

const business={

business_name:
document.getElementById("businessName").value.trim(),

phone:
document.getElementById("businessPhone").value.trim(),

email:
document.getElementById("businessEmail").value.trim(),

description:
document.getElementById("businessDescription").value.trim(),

logo:"",

address:
document.getElementById("businessAddress").value.trim()

};


document.getElementById("saveMessage").innerHTML=
"Saving settings...";


try{


const response=await fetch("/api/business",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify(business)

});



const result=await response.json();



if(response.ok){


document.getElementById("saveMessage").innerHTML=
"✅ Settings saved successfully.";


}else{


document.getElementById("saveMessage").innerHTML=
"❌ "+(result.error || "Unable to save settings.");


}



}catch(error){


document.getElementById("saveMessage").innerHTML=
"❌ Connection error.";

}



}




async function loadSettings(){


try{


const response=await fetch("/api/business");


const result=await response.json();



if(Array.isArray(result) && result.length>0){


const business=result[0];


document.getElementById("businessName").value=
business.business_name || "";


document.getElementById("businessPhone").value=
business.phone || "";


document.getElementById("businessEmail").value=
business.email || "";


document.getElementById("businessAddress").value=
business.address || "";


document.getElementById("businessDescription").value=
business.description || "";


}



}catch(error){


console.log(error);


}



}



window.onload=function(){

window.scrollTo(0,0);

loadSettings();

};


</script>


</body>

</html>
