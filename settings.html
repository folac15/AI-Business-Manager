<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Settings</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<header>

<h1>Settings</h1>

<p>Manage your business preferences</p>

</header>


<div class="card">

<h2>Business Information</h2>

<label>Business Name:</label>

<br>

<input type="text" id="businessName" placeholder="Enter business name">

<br><br>

<label>Phone Number:</label>

<br>

<input type="text" id="phone" placeholder="Enter phone number">

<br><br>

<button onclick="saveSettings()">
Save Settings
</button>

</div>


<script>

async function saveSettings(){

const business={

business_name:document.getElementById("businessName").value.trim(),

phone:document.getElementById("phone").value.trim(),

email:"",

description:"",

logo:""

};

try{

const response=await fetch("/api/business",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(business)

});

const result=await response.json();

if(response.ok){

alert("Business profile saved successfully.");

}else{

alert(result.error || "Unable to save settings.");

}

}catch(error){

alert("Connection error.");

}

}

async function loadSettings(){

try{

const response=await fetch("/api/business");

const result=await response.json();

if(Array.isArray(result) && result.length>0){

const profile=result[0];

document.getElementById("businessName").value=profile.business_name || "";

document.getElementById("phone").value=profile.phone || "";

}

}catch(error){

console.log(error);

}

}

window.onload=loadSettings;

  </script>

</body>

</html>
