<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NexaFlow AI - Business Settings</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
display:flex;
background:#f4f7fb;
min-height:100vh;
}

/* SIDEBAR */

.sidebar{
width:250px;
background:#0b1f3a;
color:white;
padding:25px;
min-height:100vh;
}

.logo{
font-size:22px;
font-weight:bold;
margin-bottom:30px;
}

.business-logo{
width:70px;
height:70px;
background:white;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
color:#0b1f3a;
margin-bottom:15px;
overflow:hidden;
}

.business-logo img{
width:100%;
height:100%;
object-fit:cover;
}

.sidebar h3{
word-break:break-word;
}

.sidebar a{
display:block;
color:white;
text-decoration:none;
padding:12px;
margin-bottom:8px;
border-radius:8px;
}

.sidebar a:hover{
background:#0066ff;
}

/* MAIN */

.main{
flex:1;
padding:30px;
}

.header{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:25px;
}

.settings-box{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,.08);
max-width:850px;
}

.settings-box h3{
margin-bottom:10px;
}

.logo-preview{
width:120px;
height:120px;
border-radius:50%;
overflow:hidden;
background:#f4f7fb;
display:flex;
align-items:center;
justify-content:center;
margin-bottom:20px;
border:2px solid #e0e5ec;
}

.logo-preview img{
width:100%;
height:100%;
object-fit:cover;
}

.logo-placeholder{
font-size:45px;
color:#0b1f3a;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,
textarea{
width:100%;
padding:12px;
margin-top:8px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
}

textarea{
height:120px;
resize:none;
}

button{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:8px;
background:#0066ff;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#004ccc;
}

.save-button{
min-width:150px;
}

#saveMessage{
margin-top:20px;
font-weight:bold;
}

.loading-message{
color:#666;
margin-top:15px;
}

.error-message{
color:#c62828;
background:#fff0f0;
padding:12px;
border-radius:8px;
margin-top:15px;
}

.success-message{
color:#008a45;
background:#effff6;
padding:12px;
border-radius:8px;
margin-top:15px;
}

/* MOBILE */

@media(max-width:800px){

body{
display:flex;
}

.sidebar{
width:85px;
padding:12px;
}

.logo{
font-size:16px;
}

.business-logo{
width:45px;
height:45px;
font-size:20px;
}

.sidebar h3{
display:none;
}

.sidebar a{
font-size:12px;
padding:8px;
}

.main{
padding:15px;
}

.settings-box{
padding:20px;
}

}

</style>

</head>

<body>

<script src="auth_guard.js"></script>

<div class="sidebar">

<div class="logo">
NexaFlow AI
</div>

<div
class="business-logo"
id="sidebarLogo">

<div class="logo-placeholder">
🏢
</div>

</div>

<h3 id="businessNameSidebar">
Your Business
</h3>

<br>

<a href="dashboard.html">
Dashboard
</a>

<a href="ai-assistant.html">
AI Assistant
</a>

<a href="customers.html">
Customers
</a>

<a href="analytics.html">
Analytics
</a>

<a href="automation.html">
Automation
</a>

<a href="reports.html">
Reports
</a>

<a href="settings.html">
Settings
</a>

</div>

<div class="main">

<div class="header">

<h2>
⚙️ Business Settings
</h2>

<p>
Manage your business information and logo.
</p>

</div>

<div class="settings-box">

<div
id="loadingMessage"
class="loading-message">

Loading business settings...

  </div>
  <div class="logo-preview">

<img
id="logoPreview"
src=""
alt="Business Logo"
style="display:none;">

<div
id="logoPlaceholder"
class="logo-placeholder">
🏢
</div>

</div>

<label>
Business Logo
</label>

<input
type="file"
id="logoFile"
accept="image/*"
onchange="previewLogo(event)">

<h3>
Business Profile
</h3>

<label>
Business Name
</label>

<input
type="text"
id="businessName"
placeholder="Enter business name">

<label>
Owner Name
</label>

<input
type="text"
id="ownerName"
placeholder="Enter owner name">

<label>
Phone Number
</label>

<input
type="text"
id="businessPhone"
placeholder="Enter phone number">

<label>
Email Address
</label>

<input
type="email"
id="businessEmail"
placeholder="Enter email address">

<label>
Business Address
</label>

<input
type="text"
id="businessAddress"
placeholder="Enter business address">

<label>
Business Description
</label>

<textarea
id="businessDescription"
placeholder="Describe your business"></textarea>

<button
class="save-button"
onclick="saveSettings()">

Save Settings

</button>

<div
id="saveMessage">
</div>

</div>

</div>

<script>

/* =====================================================
   AUTHENTICATION
===================================================== */

function getAccessToken(){

return localStorage.getItem(
"access_token"
);

}


/* =====================================================
   LOGO PREVIEW
===================================================== */

function previewLogo(event){

const file =
event.target.files[0];

if(!file){

return;

}

const logoPreview =
document.getElementById(
"logoPreview"
);

const logoPlaceholder =
document.getElementById(
"logoPlaceholder"
);

const reader =
new FileReader();

reader.onload =
function(){

logoPreview.src =
reader.result;

logoPreview.style.display =
"block";

logoPlaceholder.style.display =
"none";

};

reader.readAsDataURL(file);

}


/* =====================================================
   SHOW SAVED LOGO
===================================================== */

function showLogo(logoURL){

const logoPreview =
document.getElementById(
"logoPreview"
);

const logoPlaceholder =
document.getElementById(
"logoPlaceholder"
);

if(
logoURL &&
logoURL.trim() !== ""
){

logoPreview.src =
logoURL;

logoPreview.style.display =
"block";

logoPlaceholder.style.display =
"none";

}else{

logoPreview.style.display =
"none";

logoPlaceholder.style.display =
"flex";

}

}


/* =====================================================
   LOAD BUSINESS SETTINGS
===================================================== */

async function loadSettings(){

const token =
getAccessToken();

const loading =
document.getElementById(
"loadingMessage"
);

if(!token){

window.location.href =
"login.html";

return;

}

try{

const response =
await fetch(

"/api/business",

{

method:"GET",

headers:{

"Authorization":
"Bearer " + token

}

}

);

const result =
await response.json();

console.log(
"Business settings response:",
result
);

if(
response.status === 401
){

localStorage.removeItem(
"access_token"
);

localStorage.removeItem(
"refresh_token"
);

localStorage.removeItem(
"user_id"
);

localStorage.removeItem(
"business_id"
);

window.location.href =
"login.html";

return;

}

if(!response.ok){

loading.textContent =
"Unable to load business settings.";

return;

}

if(
!result.business
){

loading.textContent =
"No business profile found yet.";

return;

}

const business =
result.business;


/* BUSINESS NAME */

document.getElementById(
"businessName"
).value =
business.business_name || "";


/* OWNER NAME */

document.getElementById(
"ownerName"
).value =
business.owner_name || "";


/* PHONE */

document.getElementById(
"businessPhone"
).value =
business.phone || "";


/* EMAIL */

document.getElementById(
"businessEmail"
).value =
business.email || "";


/* ADDRESS */

document.getElementById(
"businessAddress"
).value =
business.address || "";


/* DESCRIPTION */

document.getElementById(
"businessDescription"
).value =
business.description || "";


/* LOGO */

showLogo(
business.logo || ""
);


/* SIDEBAR BUSINESS NAME */

const sidebarName =
document.getElementById(
"businessNameSidebar"
);

if(
sidebarName &&
business.business_name
){

sidebarName.textContent =
business.business_name;

}


/* SIDEBAR LOGO */

const sidebarLogo =
document.getElementById(
"sidebarLogo"
);

if(
sidebarLogo &&
business.logo
){

sidebarLogo.innerHTML =
`<img
src="${escapeHtml(business.logo)}"
alt="Business Logo">`;

}


/* SAVE BUSINESS ID */

if(business.id){

localStorage.setItem(
"business_id",
business.id
);

}


loading.style.display =
"none";


}catch(error){

console.error(
"Settings loading error:",
error
);

loading.textContent =
"Unable to connect to the business service.";

}

}


/* =====================================================
   HTML SAFETY
===================================================== */

function escapeHtml(value){

return String(value)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}
  /* =====================================================
   SAVE BUSINESS SETTINGS
===================================================== */

async function saveSettings(){

const token =
getAccessToken();

const saveMessage =
document.getElementById(
"saveMessage"
);

if(!token){

saveMessage.innerHTML =
"❌ Login session unavailable. Please log in again.";

return;

}


const businessName =
document.getElementById(
"businessName"
).value.trim();


const ownerName =
document.getElementById(
"ownerName"
).value.trim();


const phone =
document.getElementById(
"businessPhone"
).value.trim();


const email =
document.getElementById(
"businessEmail"
).value.trim();


const address =
document.getElementById(
"businessAddress"
).value.trim();


const description =
document.getElementById(
"businessDescription"
).value.trim();


const logoFile =
document.getElementById(
"logoFile"
).files[0];


saveMessage.innerHTML =
"Saving settings...";


try{

let logoURL = "";


/* =================================================
   GET EXISTING LOGO FIRST
================================================= */

const existingResponse =
await fetch(

"/api/business",

{

method:"GET",

headers:{

"Authorization":
"Bearer " + token

}

}

);


const existingResult =
await existingResponse.json();


if(
existingResponse.ok &&
existingResult.business
){

logoURL =
existingResult.business.logo || "";

}


/* =================================================
   UPLOAD NEW LOGO
================================================= */

if(logoFile){

const formData =
new FormData();

formData.append(
"logo",
logoFile
);


const uploadResponse =
await fetch(

"/api/business/logo",

{

method:"POST",

headers:{

"Authorization":
"Bearer " + token

},

body:formData

}

);


const uploadResult =
await uploadResponse.json();


if(
uploadResponse.status === 401
){

saveMessage.innerHTML =
"❌ Login session expired. Please log in again.";

return;

}


if(!uploadResponse.ok){

saveMessage.innerHTML =
"❌ Logo upload failed: " +
(
uploadResult.error ||
"Unable to upload logo."
);

return;

}


logoURL =
uploadResult.logo ||
logoURL;

}


/* =================================================
   SAVE BUSINESS INFORMATION
================================================= */

const response =
await fetch(

"/api/business",

{

method:"POST",

headers:{

"Content-Type":
"application/json",

"Authorization":
"Bearer " + token

},

body:JSON.stringify({

business_name:
businessName,

owner_name:
ownerName,

phone:
phone,

email:
email,

address:
address,

description:
description,

logo:
logoURL

})

}

);


const result =
await response.json();


console.log(
"Save settings response:",
result
);


if(
response.status === 401
){

saveMessage.innerHTML =
"❌ Login session expired. Please log in again.";

return;

}


if(!response.ok){

saveMessage.innerHTML =
"❌ " +
(
result.error ||
"Unable to save settings."
);

return;

}


/* =================================================
   SUCCESS
================================================= */

saveMessage.innerHTML =
"✅ Business settings saved successfully.";


showLogo(
logoURL
);


/* UPDATE SIDEBAR */

const sidebarName =
document.getElementById(
"businessNameSidebar"
);

if(
sidebarName
){

sidebarName.textContent =
businessName ||
"Your Business";

}


/* UPDATE SIDEBAR LOGO */

const sidebarLogo =
document.getElementById(
"sidebarLogo"
);

if(
sidebarLogo
){

if(logoURL){

sidebarLogo.innerHTML =
`<img
src="${escapeHtml(logoURL)}"
alt="Business Logo">`;

}else{

sidebarLogo.innerHTML =
"🏢";

}

}


/* CLEAR FILE INPUT */

document.getElementById(
"logoFile"
).value = "";


}catch(error){

console.error(
"Settings save error:",
error
);

saveMessage.innerHTML =
"❌ Connection error: " +
error.message;

}

}


/* =====================================================
   PAGE START
===================================================== */

window.addEventListener(
"load",
function(){

loadSettings();

}
);

</script>

</body>

</html>
