<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Business Settings</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
display:flex;
background:#f4f7fb;
min-height:100vh;
}

/* SIDEBAR */

.sidebar{
width:250px;
background:#0b1f3a;
color:white;
padding:25px;
}

.logo{
font-size:22px;
font-weight:bold;
margin-bottom:30px;
}

.business-logo{
width:70px;
height:70px;
background:white;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
color:#0b1f3a;
margin-bottom:15px;
}

.sidebar a{
display:block;
color:white;
text-decoration:none;
padding:12px;
margin-bottom:8px;
border-radius:8px;
}

.sidebar a:hover{
background:#0066ff;
}

/* MAIN */

.main{
flex:1;
padding:30px;
}

.header{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:25px;
}

.settings-box{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,.08);
max-width:850px;
}

.logo-preview{
width:110px;
height:110px;
border-radius:50%;
overflow:hidden;
background:#f4f7fb;
display:flex;
align-items:center;
justify-content:center;
margin-bottom:20px;
}

.logo-preview img{
width:100%;
height:100%;
object-fit:cover;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,
textarea{
width:100%;
padding:12px;
margin-top:8px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
}

textarea{
height:120px;
resize:none;
}

button{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:8px;
background:#0066ff;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#004ccc;
}

#saveMessage{
margin-top:20px;
font-weight:bold;
}

@media(max-width:800px){

body{
display:flex;
}

.sidebar{
width:85px;
padding:12px;
}

.logo{
font-size:16px;
}

.business-logo{
width:45px;
height:45px;
font-size:20px;
}

.sidebar h3{
display:none;
}

.sidebar a{
font-size:12px;
padding:8px;
}

.main{
padding:15px;
}

}

</style>

</head>
<body>
  <script src="auth_guard.js"></script>

<div class="sidebar">

<div class="logo">
NexaFlow AI
</div>

<div class="business-logo">
🏢
</div>

<h3>Your Business</h3>

<br>

<a href="dashboard.html">Dashboard</a>
<a href="ai-assistant.html">AI Assistant</a>
<a href="customers.html">Customers</a>
<a href="analytics.html">Analytics</a>
<a href="automation.html">Automation</a>
<a href="reports.html">Reports</a>
<a href="settings.html">Settings</a>

</div>

<div class="main">

<div class="header">

<h2>⚙ Business Settings</h2>

<p>Manage your business information and logo.</p>

</div>

<div class="settings-box">

<div class="logo-preview">

<img
id="logoPreview"
src="https://via.placeholder.com/110"
alt="Business Logo">

</div>

<label>Business Logo</label>

<input
type="file"
id="logoFile"
accept="image/*"
onchange="previewLogo(event)">

<h3>Business Profile</h3>

<label>Business Name</label>

<input
type="text"
id="businessName">

<label>Phone Number</label>

<input
type="text"
id="businessPhone">

<label>Email Address</label>

<input
type="email"
id="businessEmail">

<label>Business Address</label>

<input
type="text"
id="businessAddress">

<label>Business Description</label>

<textarea
id="businessDescription"></textarea>

<button onclick="saveSettings()">
Save Settings
</button>

<div id="saveMessage"></div>

</div>

</div>

<script>
  const SUPABASE_URL =
"https://xfjroysinifwncfjvrsg.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhmanJveXNpbmlmd25jZmp2cnNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyNTU3NDAsImV4cCI6MjA5OTgzMTc0MH0.wxKe_cs9n78YhF5nw63crh3pxNnkQW7VGjcqzv3adPs";

function previewLogo(event){

const file = event.target.files[0];

if(file){

const reader = new FileReader();

reader.onload = function(){

document.getElementById("logoPreview").src =
reader.result;

}

reader.readAsDataURL(file);

}

}

async function saveSettings(){

let logoURL="";

const logoFile =
document.getElementById("logoFile").files[0];

try{

if(logoFile){

const fileName =
Date.now()+"_"+logoFile.name;

const uploadResponse =
await fetch(

SUPABASE_URL +
"/storage/v1/object/business-logos/" +
fileName,

{

method:"POST",

headers:{

"apikey":SUPABASE_ANON_KEY,

"Authorization":"Bearer "+SUPABASE_ANON_KEY,

"Content-Type":logoFile.type

},

body:logoFile

}

);

if(!uploadResponse.ok){

const errorText =
await uploadResponse.text();

document.getElementById("saveMessage").innerHTML =
"❌ Upload failed : " + errorText;

return;

}

logoURL =
SUPABASE_URL +
"/storage/v1/object/public/business-logos/" +
fileName;

  }
  const business={

business_name:
document.getElementById("businessName").value.trim(),

phone:
document.getElementById("businessPhone").value.trim(),

email:
document.getElementById("businessEmail").value.trim(),

address:
document.getElementById("businessAddress").value.trim(),

description:
document.getElementById("businessDescription").value.trim(),

logo:logoURL

};

let response = await fetch("/api/business",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(business)

});

let result = await response.json();

if(response.ok){

document.getElementById("saveMessage").innerHTML =
"✅ Settings saved successfully.";

}else{

document.getElementById("saveMessage").innerHTML =
"❌ " + (result.error || "Save failed.");

}

}catch(error){

document.getElementById("saveMessage").innerHTML =
"❌ Connection error: " + error;

}

  }
  async function loadSettings(){

try{

const response =
await fetch("/api/business");

const result =
await response.json();


if(Array.isArray(result) && result.length > 0){

const business = result[0];


document.getElementById("businessName").value =
business.business_name || "";


document.getElementById("businessPhone").value =
business.phone || "";


document.getElementById("businessEmail").value =
business.email || "";


document.getElementById("businessAddress").value =
business.address || "";


document.getElementById("businessDescription").value =
business.description || "";


if(business.logo){

document.getElementById("logoPreview").src =
business.logo;

}

}


}catch(error){

console.log(error);

}

}


window.onload=function(){

window.scrollTo(0,0);

loadSettings();

};


</script>

</body>

</html>
