<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>NexaFlow AI - Customers</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
display:flex;
background:#f4f7fb;
min-height:100vh;
}

.sidebar{
width:250px;
background:#0b1f3a;
color:white;
padding:25px;
min-height:100vh;
}

.logo{
font-size:22px;
font-weight:bold;
margin-bottom:30px;
}

.business-logo{
width:70px;
height:70px;
background:white;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
color:#0b1f3a;
margin-bottom:15px;
}

.sidebar a{
display:block;
color:white;
text-decoration:none;
padding:12px;
margin-bottom:8px;
border-radius:8px;
}

.sidebar a:hover{
background:#0066ff;
}

.main{
flex:1;
padding:30px;
}

.header{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:25px;
}

.customer-box{
background:white;
padding:25px;
border-radius:12px;
margin-bottom:25px;
}

input,
textarea{
width:100%;
padding:12px;
margin-top:12px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
}

textarea{
height:100px;
resize:none;
}

button{
margin-top:15px;
padding:12px 25px;
background:#0066ff;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#004ccc;
}

.customer-list{
background:white;
padding:25px;
border-radius:12px;
}

.customer-card{
background:#f4f7fb;
padding:15px;
margin-top:15px;
border-radius:8px;
border-left:5px solid #0066ff;
}

.status{
margin-top:15px;
font-weight:bold;
}

.loading{
padding:15px 0;
color:#666;
}

.error{
padding:15px;
background:#fff0f0;
color:#c62828;
border-radius:8px;
margin-top:15px;
}

.empty{
padding:15px 0;
color:#666;
}

@media(max-width:800px){

body{
display:flex;
}

.sidebar{
width:85px;
min-height:100vh;
padding:12px;
}

.logo{
font-size:16px;
}

.business-logo{
width:45px;
height:45px;
font-size:20px;
}

.sidebar h3{
display:none;
}

.sidebar a{
font-size:12px;
padding:8px;
}

.main{
flex:1;
padding:15px;
}

}

</style>

</head>

<body>

<script src="auth_guard.js"></script>


<!-- =====================================================
     SIDEBAR
===================================================== -->

<div class="sidebar">

<div class="logo">
NexaFlow AI
</div>

<div class="business-logo">
🏢
</div>

<h3 id="businessName">
Your Business
</h3>

<br>

<a href="dashboard.html">
Dashboard
</a>

<a href="ai-assistant.html">
AI Assistant
</a>

<a href="customers.html">
Customers
</a>

<a href="analytics.html">
Analytics
</a>

<a href="automation.html">
Automation
</a>

<a href="reports.html">
Reports
</a>

<a href="settings.html">
Settings
</a>

</div>


<!-- =====================================================
     MAIN
===================================================== -->

<div class="main">


<div class="header">

<h2>
👥 Customers Management
</h2>

<p>
Manage customer information and AI replies.
</p>

</div>


<!-- =====================================================
     ADD CUSTOMER
===================================================== -->

<div class="customer-box">

<h3>
Add Customer
</h3>


<input
type="text"
id="customerName"
placeholder="Customer Name">


<input
type="text"
id="customerPhone"
placeholder="Phone Number">


<input
type="text"
id="customerLocation"
placeholder="Location">


<textarea
id="customerMessage"
placeholder="Customer Message"></textarea>


<button
onclick="saveCustomer()">

Save Customer

</button>


<div
id="saveStatus"
class="status">
</div>

</div>


<!-- =====================================================
     CUSTOMER HISTORY
===================================================== -->

<div class="customer-list">

<h3>
Customer History
</h3>


<div
id="customerHistory"
class="loading">

Loading customers...

</div>

</div>


</div>


<script>

/* =====================================================
   LOAD BUSINESS NAME
===================================================== */

async function loadBusiness(){

const token =
localStorage.getItem(
"access_token"
);


if(!token){

return;

}


try{

const response =
await fetch(

"/api/business",

{

method:"GET",

headers:{

"Authorization":
"Bearer " + token

}

}

);


const result =
await response.json();


if(
response.status === 401
){

return;

}


if(
result.business &&
result.business.business_name
){

document.getElementById(
"businessName"
).textContent =
result.business.business_name;

}

}catch(error){

console.error(
"Business loading error:",
error
);

}

}


/* =====================================================
   SAVE CUSTOMER
===================================================== */

async function saveCustomer(){

const name =
document.getElementById(
"customerName"
).value.trim();


const phone =
document.getElementById(
"customerPhone"
).value.trim();


const location =
document.getElementById(
"customerLocation"
).value.trim();


const message =
document.getElementById(
"customerMessage"
).value.trim();


const status =
document.getElementById(
"saveStatus"
);


if(
name === ""
||
message === ""
){

status.innerHTML =
"❌ Please enter customer name and message.";

return;

}


const token =
localStorage.getItem(
"access_token"
);


if(!token){

status.innerHTML =
"❌ Login session unavailable. Please log in again.";

return;

}


status.innerHTML =
"Saving customer...";


try{

const response =
await fetch(

"/api/customers",

{

method:"POST",

headers:{

"Content-Type":
"application/json",

"Authorization":
"Bearer " + token

},

body:JSON.stringify({

name:name,

phone:phone,

location:location,

message:message

})

}

);


const result =
await response.json();


console.log(
"Save customer response:",
result
);


if(
response.status === 401
){

status.innerHTML =
"❌ Login session expired. Please log in again.";

return;

}


if(!response.ok){

status.innerHTML =
"❌ " +
(
result.error ||
"Unable to save customer."
);

return;

}


status.innerHTML =
"✅ Customer saved successfully.";


document.getElementById(
"customerName"
).value = "";


document.getElementById(
"customerPhone"
).value = "";


document.getElementById(
"customerLocation"
).value = "";


document.getElementById(
"customerMessage"
).value = "";


await loadCustomers();


}catch(error){

console.error(
"Customer save error:",
error
);

status.innerHTML =
"❌ Connection error.";

}

}


/* =====================================================
   LOAD CUSTOMERS
===================================================== */

async function loadCustomers(){

const history =
document.getElementById(
"customerHistory"
);


const token =
localStorage.getItem(
"access_token"
);


if(!token){

history.innerHTML =
'<div class="error">Login session unavailable.</div>';

return;

}


history.innerHTML =
'<div class="loading">Loading customers...</div>';


try{

const response =
await fetch(

"/api/customers",

{

method:"GET",

headers:{

"Authorization":
"Bearer " + token

}

}

);


const result =
await response.json();


console.log(
"Customers response:",
result
);


if(
response.status === 401
){

history.innerHTML =
'<div class="error">Login session expired. Please log in again.</div>';

return;

}


if(!response.ok){

history.innerHTML =
'<div class="error">' +
(
result.error ||
"Unable to load customers."
) +
'</div>';

return;

}


if(
!Array.isArray(result)
){

history.innerHTML =
'<div class="error">The server returned an unexpected response.</div>';

return;

}


if(result.length === 0){

history.innerHTML =
'<div class="empty">No customers found yet.</div>';

return;

}


let html = "";


result.forEach(
function(customer){

html += `

<div class="customer-card">

<b>Name:</b>
${escapeHtml(customer.name || "")}

<br>

<b>Phone:</b>
${escapeHtml(customer.phone || "")}

<br>

<b>Location:</b>
${escapeHtml(customer.location || "")}

<br><br>

<b>Message:</b>

<br>

${escapeHtml(customer.message || "")}

<br><br>

<b>AI Reply:</b>

<br>

${escapeHtml(customer.ai_reply || "")}

<br><br>

<small>

${escapeHtml(customer.created_at || "")}

</small>

</div>

`;

});


history.innerHTML =
html;


}catch(error){

console.error(
"Customer loading error:",
error
);


history.innerHTML =
'<div class="error">Unable to load customers. Check the browser console and Render logs.</div>';

}

}


/* =====================================================
   HTML SAFETY
===================================================== */

function escapeHtml(value){

return String(value)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =====================================================
   PAGE START
===================================================== */

window.addEventListener(
"load",
function(){

loadBusiness();

loadCustomers();

}
);

</script>


</body>

   </html>
