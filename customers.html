<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customers</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
display:flex;
background:#f4f7fb;
min-height:100vh;
}

/* SIDEBAR */

.sidebar{
width:250px;
background:#0b1f3a;
color:white;
padding:25px;
}

.logo{
font-size:22px;
font-weight:bold;
margin-bottom:30px;
}

.business-logo{
width:70px;
height:70px;
background:white;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
color:#0b1f3a;
margin-bottom:15px;
}

.sidebar a{
display:block;
color:white;
text-decoration:none;
padding:12px;
margin-bottom:8px;
border-radius:8px;
}

.sidebar a:hover{
background:#0066ff;
}

/* MAIN */

.main{
flex:1;
padding:30px;
}

.header{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:25px;
}

.customer-box{
background:white;
padding:25px;
border-radius:12px;
margin-bottom:25px;
}

input,
textarea{
width:100%;
padding:12px;
margin-top:12px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
}

textarea{
height:100px;
resize:none;
}

button{
margin-top:15px;
padding:12px 25px;
background:#0066ff;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#004ccc;
}

.customer-list{
background:white;
padding:25px;
border-radius:12px;
}

.customer-card{
background:#f4f7fb;
padding:15px;
margin-top:15px;
border-radius:8px;
border-left:5px solid #0066ff;
}

/* MOBILE */

@media(max-width:800px){

body{
display:flex;
}

.sidebar{
width:85px;
min-height:100vh;
padding:12px;
}

.logo{
font-size:16px;
}

.business-logo{
width:45px;
height:45px;
font-size:20px;
}

.sidebar h3{
display:none;
}

.sidebar a{
font-size:12px;
padding:8px;
}

.main{
flex:1;
padding:15px;
}

}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">
NexaFlow AI
</div>

<div class="business-logo">
🏢
</div>

<h3>Your Business</h3>

<br>

<a href="dashboard.html">Dashboard</a>
<a href="ai-assistant.html">AI Assistant</a>
<a href="customers.html">Customers</a>
<a href="analytics.html">Analytics</a>
<a href="automation.html">Automation</a>
<a href="reports.html">Reports</a>
<a href="settings.html">Settings</a>

</div>

<div class="main">

<div class="header">

<h2>👥 Customers Management</h2>

<p>Manage customer information and AI replies.</p>

</div>

<div class="customer-box">

<h3>Add Customer</h3>

<input
type="text"
id="customerName"
placeholder="Customer Name">

<input
type="text"
id="customerPhone"
placeholder="Phone Number">

<input
type="text"
id="customerLocation"
placeholder="Location">

<textarea
id="customerMessage"
placeholder="Customer Message">
</textarea>

<button onclick="saveCustomer()">
Save Customer
</button>

<div
id="saveStatus"
style="margin-top:20px;font-weight:bold;">
</div>

</div>

<div class="customer-list">

<h3>Customer History</h3>

<div id="customerHistory">

Loading...

</div>

</div>

  </div>
  <script>

async function saveCustomer(){

const name=document.getElementById("customerName").value.trim();
const phone=document.getElementById("customerPhone").value.trim();
const location=document.getElementById("customerLocation").value.trim();
const message=document.getElementById("customerMessage").value.trim();

if(name=="" || message==""){

document.getElementById("saveStatus").innerHTML="Please enter customer name and message.";
return;

}

document.getElementById("saveStatus").innerHTML="Saving customer...";

try{

const response=await fetch("/api/customers",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

name:name,
phone:phone,
location:location,
message:message

})

});

const result=await response.json();

if(response.ok){

document.getElementById("saveStatus").innerHTML=
"✅ Customer saved successfully.";

document.getElementById("customerName").value="";
document.getElementById("customerPhone").value="";
document.getElementById("customerLocation").value="";
document.getElementById("customerMessage").value="";

loadCustomers();

}else{

document.getElementById("saveStatus").innerHTML=
"❌ "+(result.error || "Unable to save customer.");

}

}catch(error){

document.getElementById("saveStatus").innerHTML=
"❌ Connection error.";

}

}



async function loadCustomers(){

try{

const response=await fetch("/api/customers");

const customers=await response.json();

let html="";

if(!Array.isArray(customers) || customers.length===0){

html="<p>No customers found.</p>";

}else{

customers.forEach(customer=>{

html+=`

<div class="customer-card">

<b>Name:</b> ${customer.name || ""}<br>

<b>Phone:</b> ${customer.phone || ""}<br>

<b>Location:</b> ${customer.location || ""}<br><br>

<b>Message:</b><br>

${customer.message || ""}

<br><br>

<b>AI Reply:</b><br>

${customer.ai_reply || ""}

<br><br>

<small>

${customer.created_at || ""}

</small>

</div>

`;

});

}

document.getElementById("customerHistory").innerHTML=html;

}catch(error){

document.getElementById("customerHistory").innerHTML=
"Unable to load customers.";

}

}



window.onload=function(){

window.scrollTo(0,0);

loadCustomers();

};

</script>

</body>

</html>
