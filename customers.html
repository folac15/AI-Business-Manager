<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NexaFlow AI - Customers</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    background:#f4f7fb;
    min-height:100vh;
    color:#222;
}

.sidebar{
    width:250px;
    background:#0b1f3a;
    color:white;
    padding:25px;
    min-height:100vh;
    flex-shrink:0;
}

.logo{
    font-size:22px;
    font-weight:bold;
    margin-bottom:30px;
}

.business-logo{
    width:70px;
    height:70px;
    background:white;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    color:#0b1f3a;
    margin-bottom:15px;
}

.sidebar h3{
    margin-bottom:20px;
    word-break:break-word;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:12px;
    margin-bottom:8px;
    border-radius:8px;
}

.sidebar a:hover,
.sidebar a.active{
    background:#0066ff;
}

.main{
    flex:1;
    padding:30px;
    min-width:0;
}

.header{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:25px;
    border:1px solid #e5e7eb;
}

.header h2{
    color:#0b1f3a;
    margin-bottom:6px;
}

.header p{
    color:#777;
}

.customer-box{
    background:white;
    padding:25px;
    border-radius:12px;
    margin-bottom:25px;
    border:1px solid #e5e7eb;
}

.customer-box h3{
    color:#0b1f3a;
    margin-bottom:10px;
}

input,
textarea{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
    outline:none;
}

input:focus,
textarea:focus{
    border-color:#0066ff;
    box-shadow:0 0 0 2px rgba(0,102,255,.08);
}

textarea{
    height:110px;
    resize:vertical;
    min-height:100px;
}

.save-button{
    margin-top:15px;
    padding:14px 25px;
    background:#0066ff;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    width:100%;
}

.save-button:hover{
    background:#004ccc;
}

.save-button:disabled{
    background:#999;
    cursor:not-allowed;
}

.status{
    margin-top:15px;
    font-weight:bold;
    line-height:1.5;
}

.success{
    color:#16803c;
}

.error-text{
    color:#c62828;
}

.customer-list{
    background:white;
    padding:25px;
    border-radius:12px;
    border:1px solid #e5e7eb;
}

.customer-list h3{
    color:#0b1f3a;
    margin-bottom:10px;
}

.loading{
    padding:20px 0;
    color:#666;
}

.error-box{
    padding:15px;
    background:#fff0f0;
    color:#c62828;
    border-radius:8px;
    margin-top:15px;
    line-height:1.5;
}

.empty{
    padding:20px 0;
    color:#666;
}

.customer-card{
    background:#f4f7fb;
    padding:18px;
    margin-top:15px;
    border-radius:10px;
    border-left:5px solid #0066ff;
}

.customer-card b{
    color:#0b1f3a;
}

.customer-message,
.ai-reply{
    margin-top:6px;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-word;
}

.customer-date{
    display:block;
    margin-top:15px;
    color:#777;
    font-size:12px;
}

.delete-button{
    margin-top:15px;
    padding:9px 15px;
    background:#dc3545;
    color:white;
    border:none;
    border-radius:7px;
    cursor:pointer;
}

.delete-button:hover{
    background:#b02a37;
}

.refresh-button{
    margin-top:10px;
    padding:10px 18px;
    background:#0b1f3a;
    color:white;
    border:none;
    border-radius:7px;
    cursor:pointer;
}

.refresh-button:hover{
    background:#17365f;
}

@media(max-width:800px){

    .sidebar{
        width:85px;
        min-height:100vh;
        padding:12px;
    }

    .logo{
        font-size:15px;
    }

    .business-logo{
        width:45px;
        height:45px;
        font-size:20px;
    }

    .sidebar h3{
        display:none;
    }

    .sidebar a{
        font-size:11px;
        padding:8px;
    }

    .main{
        padding:15px;
    }

    .header{
        padding:17px;
    }

    .customer-box,
    .customer-list{
        padding:18px;
    }

}

</style>

</head>

<body>

<script src="auth_guard.js"></script>

<div class="sidebar">

    <div class="logo">
        NexaFlow AI
    </div>

    <div class="business-logo">
        🏢
    </div>

    <h3 id="businessName">
        Your Business
    </h3>

    <a href="dashboard.html">
        Dashboard
    </a>

    <a href="ai-assistant.html">
        AI Assistant
    </a>

    <a href="customers.html" class="active">
        Customers
    </a>

    <a href="analytics.html">
        Analytics
    </a>

    <a href="automation.html">
        Automation
    </a>

    <a href="reports.html">
        Reports
    </a>

    <a href="settings.html">
        Settings
    </a>

</div>


<div class="main">

    <div class="header">

        <h2>
            👥 Customers Management
        </h2>

        <p>
            Manage customer information and AI replies.
        </p>

    </div>


    <div class="customer-box">

        <h3>
            Add Customer
        </h3>

        <input
            type="text"
            id="customerName"
            placeholder="Customer Name"
            autocomplete="name">

        <input
            type="text"
            id="customerPhone"
            placeholder="Phone Number"
            autocomplete="tel">

        <input
            type="text"
            id="customerLocation"
            placeholder="Location">

        <textarea
            id="customerMessage"
            placeholder="Customer Message"></textarea>

        <button
            id="saveButton"
            class="save-button"
            onclick="saveCustomer()">

            Save Customer

        </button>

        <div
            id="saveStatus"
            class="status">
        </div>

    </div>


    <div class="customer-list">

        <h3>
            Customer History
        </h3>

        <button
            class="refresh-button"
            onclick="loadCustomers()">

            🔄 Refresh Customers

        </button>

        <div
            id="customerHistory"
            class="loading">

            Loading customers...

        </div>

    </div>

</div>


<script>


// =========================================================
// LOAD BUSINESS INFORMATION
// =========================================================

async function loadBusiness(){

    const token =
        localStorage.getItem("access_token");

    if(!token){
        return;
    }

    try{

        const response =
            await fetch(
                "/api/business",
                {
                    method:"GET",
                    headers:{
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        if(response.status === 401){
            return;
        }


        const result =
            await response.json();


        if(
            result.business &&
            result.business.business_name
        ){

            const businessName =
                document.getElementById(
                    "businessName"
                );


            if(businessName){

                businessName.textContent =
                    result.business.business_name;

            }

        }


    }catch(error){

        console.error(
            "Business loading error:",
            error
        );

    }

}


// =========================================================
// SAVE CUSTOMER
// =========================================================

async function saveCustomer(){

    const name =
        document
        .getElementById("customerName")
        .value
        .trim();


    const phone =
        document
        .getElementById("customerPhone")
        .value
        .trim();


    const location =
        document
        .getElementById("customerLocation")
        .value
        .trim();


    const message =
        document
        .getElementById("customerMessage")
        .value
        .trim();


    const status =
        document.getElementById(
            "saveStatus"
        );


    const button =
        document.getElementById(
            "saveButton"
        );


    // -----------------------------------------------------
    // VALIDATION
    // -----------------------------------------------------

    if(
        name === "" ||
        message === ""
    ){

        status.className =
            "status error-text";

        status.textContent =
            "❌ Please enter customer name and message.";

        return;

    }


    const token =
        localStorage.getItem(
            "access_token"
        );


    if(!token){

        status.className =
            "status error-text";

        status.textContent =
            "❌ Login session unavailable. Please log in again.";

        return;

    }


    button.disabled = true;


    status.className =
        "status";


    status.textContent =
        "Saving customer...";


    try{

        const response =
            await fetch(
                "/api/customers",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token
                    },

                    body:JSON.stringify({

                        name:name,

                        phone:phone,

                        location:location,

                        message:message

                    })
                }
            );


        let result = {};


        try{

            result =
                await response.json();

        }catch(error){

            result = {};

        }


        console.log(
            "Save customer response:",
            result
        );


        if(response.status === 401){

            status.className =
                "status error-text";

            status.textContent =
                "❌ Login session expired. Please log in again.";

            return;

        }


        if(!response.ok){

            status.className =
                "status error-text";

            status.textContent =
                "❌ " +
                (
                    result.error ||
                    "Unable to save customer."
                );

            return;

        }


        status.className =
            "status success";


        status.textContent =
            "✅ Customer saved successfully.";


        // -------------------------------------------------
        // CLEAR FORM
        // -------------------------------------------------

        document
        .getElementById("customerName")
        .value = "";


        document
        .getElementById("customerPhone")
        .value = "";


        document
        .getElementById("customerLocation")
        .value = "";


        document
        .getElementById("customerMessage")
        .value = "";


        // -------------------------------------------------
        // RELOAD CUSTOMER HISTORY
        // -------------------------------------------------

        await loadCustomers();


    }catch(error){

        console.error(
            "Customer save error:",
            error
        );


        status.className =
            "status error-text";


        status.textContent =
            "❌ Connection error. Please try again.";

    }finally{

        button.disabled = false;

    }

}


// =========================================================
// LOAD CUSTOMERS
// =========================================================

async function loadCustomers(){

    const history =
        document.getElementById(
            "customerHistory"
        );


    const token =
        localStorage.getItem(
            "access_token"
        );


    if(!token){

        history.innerHTML =
            '<div class="error-box">' +
            'Login session unavailable.' +
            '</div>';

        return;

    }


    history.innerHTML =
        '<div class="loading">' +
        'Loading customers...' +
        '</div>';


    try{

        const response =
            await fetch(
                "/api/customers",
                {
                    method:"GET",

                    headers:{
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        let result = {};


        try{

            result =
                await response.json();

        }catch(error){

            result = {};

        }


        console.log(
            "Customers GET response:",
            result
        );


        // -------------------------------------------------
        // AUTHENTICATION ERROR
        // -------------------------------------------------

        if(response.status === 401){

            history.innerHTML =
                '<div class="error-box">' +
                'Login session expired. Please log in again.' +
                '</div>';

            return;

        }


        // -------------------------------------------------
        // SERVER ERROR
        // -------------------------------------------------

        if(!response.ok){

            history.innerHTML =
                '<div class="error-box">' +

                escapeHtml(
                    result.error ||
                    "Unable to load customers."
                ) +

                '</div>';

            return;

        }


        // -------------------------------------------------
        // IMPORTANT FIX
        //
        // Backend returns:
        //
        // {
        //     customers: [...],
        //     count: 1
        // }
        //
        // NOT:
        //
        // [...]
        // -------------------------------------------------

        let customers = [];


        if(
            result &&
            Array.isArray(
                result.customers
            )
        ){

            customers =
                result.customers;

        }

        else if(
            Array.isArray(result)
        ){

            // Backward compatibility
            customers =
                result;

        }

        else{

            history.innerHTML =
                '<div class="error-box">' +
                'The server returned an invalid customer data format.' +
                '</div>';

            return;

        }


        // -------------------------------------------------
        // NO CUSTOMERS
        // -------------------------------------------------

        if(customers.length === 0){

            history.innerHTML =
                '<div class="empty">' +
                'No customers found yet.' +
                '</div>';

            return;

        }


        // -------------------------------------------------
        // DISPLAY CUSTOMERS
        // -------------------------------------------------

        let html = "";


        customers.forEach(
            function(customer){

                html += `

                    <div class="customer-card">

                        <b>Name:</b>
                        ${escapeHtml(
                            customer.name || ""
                        )}

                        <br>

                        <b>Phone:</b>
                        ${escapeHtml(
                            customer.phone || ""
                        )}

                        <br>

                        <b>Location:</b>
                        ${escapeHtml(
                            customer.location || ""
                        )}

                        <br><br>

                        <b>Message:</b>

                        <div class="customer-message">
                            ${escapeHtml(
                                customer.message || ""
                            )}
                        </div>

                        <br>

                        <b>AI Reply:</b>

                        <div class="ai-reply">
                            ${escapeHtml(
                                customer.ai_reply || ""
                            )}
                        </div>

                        <span class="customer-date">

                            ${formatDate(
                                customer.created_at
                            )}

                        </span>

                        ${
                            customer.id
                            ?
                            `
                            <button
                                class="delete-button"
                                onclick="deleteCustomer(${customer.id})">

                                🗑️ Delete

                            </button>
                            `
                            :
                            ""
                        }

                    </div>

                `;

            }
        );


        history.innerHTML =
            html;


    }catch(error){

        console.error(
            "Customer loading error:",
            error
        );


        history.innerHTML =
            '<div class="error-box">' +
            'Unable to load customers. Check your connection and server.' +
            '</div>';

    }

}


// =========================================================
// DELETE CUSTOMER
// =========================================================

async function deleteCustomer(
    customerId
){

    if(
        !confirm(
            "Are you sure you want to delete this customer?"
        )
    ){

        return;

    }


    const token =
        localStorage.getItem(
            "access_token"
        );


    if(!token){

        alert(
            "Login session unavailable."
        );

        return;

    }


    try{

        const response =
            await fetch(
                "/api/customers/" +
                customerId,
                {
                    method:"DELETE",

                    headers:{
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        let result = {};


        try{

            result =
                await response.json();

        }catch(error){

            result = {};

        }


        if(response.status === 401){

            alert(
                "Login session expired."
            );

            return;

        }


        if(!response.ok){

            alert(
                result.error ||
                "Unable to delete customer."
            );

            return;

        }


        await loadCustomers();


    }catch(error){

        console.error(
            "Delete customer error:",
            error
        );


        alert(
            "Connection error while deleting customer."
        );

    }

}


// =========================================================
// ESCAPE HTML
// =========================================================

function escapeHtml(
    value
){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


// =========================================================
// FORMAT DATE
// =========================================================

function formatDate(
    value
){

    if(!value){

        return "Date unavailable";

    }


    try{

        const date =
            new Date(value);


        if(
            Number.isNaN(
                date.getTime()
            )
        ){

            return escapeHtml(
                value
            );

        }


        return escapeHtml(
            date.toLocaleString()
        );

    }catch(error){

        return escapeHtml(
            value
        );

    }

}


// =========================================================
// PAGE LOAD
// =========================================================

window.addEventListener(
    "load",
    function(){

        loadBusiness();

        loadCustomers();

    }
);

</script>

</body>

</html>
