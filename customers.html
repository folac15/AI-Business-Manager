/* ============================================================
   LOAD BUSINESS
============================================================ */

async function loadBusiness(){

const token =
localStorage.getItem(
"access_token"
);


if(!token){

window.location.href =
"login.html";

return;

}


try{

const response =
await fetch(

SUPABASE_URL +
"/auth/v1/user",

{

method:"GET",

headers:{

"apikey":
SUPABASE_ANON_KEY,

"Authorization":
"Bearer " + token

}

}

);


const user =
await response.json();


if(
!response.ok ||
!user.id
){

localStorage.removeItem(
"access_token"
);

window.location.href =
"login.html";

return;

}


/* Get business account */

const businessResponse =
await fetch(

SUPABASE_URL +
"/rest/v1/business_accounts" +
"?user_id=eq." +
encodeURIComponent(user.id) +
"&select=business_name",

{

method:"GET",

headers:{

"apikey":
SUPABASE_ANON_KEY,

"Authorization":
"Bearer " + token

}

}

);


const businesses =
await businessResponse.json();


if(
businessResponse.ok &&
businesses.length > 0
){

document.getElementById(
"businessName"
).textContent =
businesses[0].business_name ||
"Your Business";

}


}catch(error){

console.error(
"Business loading error:",
error
);

}

}


/* ============================================================
   SAVE CUSTOMER
============================================================ */

async function saveCustomer(){

const name =
document.getElementById(
"customerName"
).value.trim();


const phone =
document.getElementById(
"customerPhone"
).value.trim();


const location =
document.getElementById(
"customerLocation"
).value.trim();


const message =
document.getElementById(
"customerMessage"
).value.trim();


const status =
document.getElementById(
"saveStatus"
);


if(
name === "" ||
message === ""
){

status.innerHTML =
"❌ Please enter customer name and message.";

return;

}


status.innerHTML =
"Saving customer...";


const token =
localStorage.getItem(
"access_token"
);


if(!token){

window.location.href =
"login.html";

return;

}


try{

const response =
await fetch(

"/api/customers",

{

method:"POST",

headers:{

"Content-Type":
"application/json",

"Authorization":
"Bearer " + token

},

body:JSON.stringify({

name:name,

phone:phone,

location:location,

message:message

})

}

);


const result =
await response.json();


if(response.ok){

status.innerHTML =
"✅ Customer saved successfully.";


document.getElementById(
"customerName"
).value="";


document.getElementById(
"customerPhone"
).value="";


document.getElementById(
"customerLocation"
).value="";


document.getElementById(
"customerMessage"
).value="";


loadCustomers();


}else{

status.innerHTML =
"❌ " +
(
result.error ||
"Unable to save customer."
);

}

}catch(error){

console.error(error);

status.innerHTML =
"❌ Connection error.";

}

}


/* ============================================================
   LOAD CUSTOMERS
============================================================ */

async function loadCustomers(){

const token =
localStorage.getItem(
"access_token"
);


if(!token){

window.location.href =
"login.html";

return;

}


const history =
document.getElementById(
"customerHistory"
);


history.innerHTML =
"Loading...";


try{

const response =
await fetch(

"/api/customers",

{

method:"GET",

headers:{

"Authorization":
"Bearer " + token

}

}

);


const customers =
await response.json();


if(!response.ok){

history.innerHTML =
"❌ " +
(
customers.error ||
"Unable to load customers."
);

return;

}


let html="";


if(
!Array.isArray(customers) ||
customers.length===0
){

html =
"<p>No customers found.</p>";

}else{

customers.forEach(
function(customer){

html += `

<div class="customer-card">

<b>Name:</b>
${escapeHTML(
customer.name || ""
)}

<br>

<b>Phone:</b>
${escapeHTML(
customer.phone || ""
)}

<br>

<b>Location:</b>
${escapeHTML(
customer.location || ""
)}

<br><br>

<b>Message:</b>
<br>

${escapeHTML(
customer.message || ""
)}

<br><br>

<b>AI Reply:</b>
<br>

${escapeHTML(
customer.ai_reply || ""
)}

<br><br>

<small>
${escapeHTML(
customer.created_at || ""
)}
</small>

</div>

`;

}
);

}


history.innerHTML =
html;


}catch(error){

console.error(error);

history.innerHTML =
"❌ Unable to load customers.";

}

}


/* ============================================================
   HTML SECURITY
============================================================ */

function escapeHTML(value){

return String(value)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* ============================================================
   START
============================================================ */

window.onload =
function(){

window.scrollTo(
0,
0
);

loadBusiness();

loadCustomers();

};


</script>
