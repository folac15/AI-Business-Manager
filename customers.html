<body>

<div class="main">

<div class="customer-box">

<h3>Add Customer</h3>

<input

<input
type="text"
id="customerPhone"
placeholder="Phone Number">

<input
type="text"
id="customerLocation"
placeholder="Location">

<textarea
id="customerMessage"
placeholder="Customer Message"></textarea>

<button onclick="saveCustomer()">
Save Customer
</button>

id="saveStatus"
style="margin-top:20px;font-weight:bold;">
</div>

</div>

<h3>Customer History</h3>

Loading...
</div>

<script>

/* ============================================================
   GET LOGIN TOKEN
============================================================ */

function getAccessToken(){

const token =
localStorage.getItem("access_token");

return token;

}


/* ============================================================
   CHECK LOGIN
============================================================ */

function checkLogin(){

const token =
getAccessToken();

if(!token){

window.location.href =
"login.html";

return false;

}

return true;

}


/* ============================================================
   SAVE CUSTOMER
============================================================ */

async function saveCustomer(){


if(!checkLogin()){

return;

}


const name =
document
.getElementById("customerName")
.value
.trim();


const phone =
document
.getElementById("customerPhone")
.value
.trim();


const location =
document
.getElementById("customerLocation")
.value
.trim();


const message =
document
.getElementById("customerMessage")
.value
.trim();


const status =
document.getElementById(
"saveStatus"
);


if(name === "" || message === ""){

status.innerHTML =
"Please enter customer name and message.";

return;

}


status.innerHTML =
"Saving customer...";


const token =
getAccessToken();


try{


const response =
await fetch(

"/api/customers",

{

method:"POST",

headers:{

"Content-Type":
"application/json",

"Authorization":
"Bearer " + token

},

body:JSON.stringify({

name:name,

phone:phone,

location:location,

message:message

})

}

);


const result =
await response.json();


if(response.ok){


status.innerHTML =
"✅ Customer saved successfully.";


document.getElementById(
"customerName"
).value="";


document.getElementById(
"customerPhone"
).value="";


document.getElementById(
"customerLocation"
).value="";


document.getElementById(
"customerMessage"
).value="";


loadCustomers();


}else{


if(
response.status === 401
){

status.innerHTML =
"❌ Login session expired. Please log in again.";

localStorage.removeItem(
"access_token"
);

setTimeout(function(){

window.location.href =
"login.html";

},1500);

return;

}


status.innerHTML =
"❌ " +
(
result.error ||
"Unable to save customer."
);

}


}catch(error){


console.error(
"Customer save error:",
error
);


status.innerHTML =
"❌ Connection error.";

}

}


/* ============================================================
   LOAD CUSTOMERS
============================================================ */

async function loadCustomers(){


if(!checkLogin()){

return;

}


const token =
getAccessToken();


const history =
document.getElementById(
"customerHistory"
);


history.innerHTML =
"Loading customers...";


try{


const response =
await fetch(

"/api/customers",

{

method:"GET",

headers:{

"Authorization":
"Bearer " + token

}

}

);


const customers =
await response.json();


if(
response.status === 401
){

history.innerHTML =
"❌ Login session expired. Please log in again.";

localStorage.removeItem(
"access_token"
);

setTimeout(function(){

window.location.href =
"login.html";

},1500);

return;

}


if(!response.ok){

history.innerHTML =
"❌ " +
(
customers.error ||
"Unable to load customers."
);

return;

}


let html="";


if(
!Array.isArray(customers) ||
customers.length === 0
){

html =
"<p>No customers found.</p>";

}else{


customers.forEach(
function(customer){

html += `

<div class="customer-card">

<b>Name:</b>
${escapeHTML(customer.name || "")}
<br>

<b>Phone:</b>
${escapeHTML(customer.phone || "")}
<br>

<b>Location:</b>
${escapeHTML(customer.location || "")}

<br><br>

<b>Message:</b>
<br>

${escapeHTML(customer.message || "")}

<br><br>

<b>AI Reply:</b>
<br>

${escapeHTML(customer.ai_reply || "")}

<br><br>

<small>
${escapeHTML(customer.created_at || "")}
</small>

</div>

`;

});


}


history.innerHTML =
html;


}catch(error){


console.error(
"Customer loading error:",
error
);


history.innerHTML =
"❌ Unable to load customers.";

}

}


/* ============================================================
   SECURITY
   PREVENT CUSTOMER TEXT FROM BEING
   INTERPRETED AS HTML
============================================================ */

function escapeHTML(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* ============================================================
   PAGE LOAD
============================================================ */

window.addEventListener(
"load",
function(){

if(checkLogin()){

loadCustomers();

}

});


</script>
