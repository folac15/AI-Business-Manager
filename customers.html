<script>

/* ==================================================
   GET CURRENT USER
================================================== */

async function getCurrentUser(){

const token =
localStorage.getItem("access_token");


if(!token){

window.location.href="login.html";

return null;

}


try{

const response =
await fetch(

SUPABASE_URL +
"/auth/v1/user",

{

method:"GET",

headers:{

"apikey":
SUPABASE_ANON_KEY,

"Authorization":
"Bearer " + token

}

}

);


const user =
await response.json();


if(!response.ok || !user.id){

document.getElementById(
"customerHistory"
).innerHTML=
"Login session expired. Please log in again.";

localStorage.removeItem(
"access_token"
);

setTimeout(function(){

window.location.href=
"login.html";

},1500);

return null;

}


localStorage.setItem(
"user_id",
user.id
);


return user;


}catch(error){

console.error(
"Authentication error:",
error
);

document.getElementById(
"customerHistory"
).innerHTML=
"Unable to verify your login session.";

return null;

}

}


/* ==================================================
   SAVE CUSTOMER
================================================== */

async function saveCustomer(){

const user =
await getCurrentUser();


if(!user){

return;

}


const name =
document.getElementById(
"customerName"
).value.trim();


const phone =
document.getElementById(
"customerPhone"
).value.trim();


const location =
document.getElementById(
"customerLocation"
).value.trim();


const message =
document.getElementById(
"customerMessage"
).value.trim();


if(name==="" || message===""){

document.getElementById(
"saveStatus"
).innerHTML=
"Please enter customer name and message.";

return;

}


document.getElementById(
"saveStatus"
).innerHTML=
"Saving customer...";


try{

const response =
await fetch(

"/api/customers",

{

method:"POST",

headers:{

"Content-Type":
"application/json",

"Authorization":
"Bearer " +
localStorage.getItem(
"access_token"
)

},

body:JSON.stringify({

name:name,

phone:phone,

location:location,

message:message

})

}

);


const result =
await response.json();


if(response.ok){

document.getElementById(
"saveStatus"
).innerHTML=
"✅ Customer saved successfully.";


document.getElementById(
"customerName"
).value="";


document.getElementById(
"customerPhone"
).value="";


document.getElementById(
"customerLocation"
).value="";


document.getElementById(
"customerMessage"
).value="";


loadCustomers();


}else{

document.getElementById(
"saveStatus"
).innerHTML=
"❌ " +
(result.error ||
"Unable to save customer.");

}

}catch(error){

console.error(error);

document.getElementById(
"saveStatus"
).innerHTML=
"❌ Connection error.";

}

}


/* ==================================================
   LOAD CUSTOMERS
================================================== */

async function loadCustomers(){

const user =
await getCurrentUser();


if(!user){

return;

}


try{

const response =
await fetch(

"/api/customers",

{

method:"GET",

headers:{

"Authorization":
"Bearer " +
localStorage.getItem(
"access_token"
)

}

}

);


const customers =
await response.json();


if(!response.ok){

document.getElementById(
"customerHistory"
).innerHTML=
"❌ " +
(
customers.error ||
"Unable to load customers."
);

return;

}


let html="";


if(
!Array.isArray(customers) ||
customers.length===0
){

html=
"<p>No customers found.</p>";

}else{


customers.forEach(
function(customer){

html+=`

<div class="customer-card">

<b>Name:</b>
${customer.name || ""}

<br>

<b>Phone:</b>
${customer.phone || ""}

<br>

<b>Location:</b>
${customer.location || ""}

<br><br>

<b>Message:</b>

<br>

${customer.message || ""}

<br><br>

<b>AI Reply:</b>

<br>

${customer.ai_reply || ""}

<br><br>

<small>
${customer.created_at || ""}
</small>

</div>

`;

});

}


document.getElementById(
"customerHistory"
).innerHTML=
html;


}catch(error){

console.error(error);

document.getElementById(
"customerHistory"
).innerHTML=
"Unable to load customers.";

}

}


/* ==================================================
   PAGE START
================================================== */

window.addEventListener(
"load",
function(){

loadCustomers();

});

</script>
