<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer CRM</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="topbar">

<h1>AI Business Manager</h1>

<p>Customer Relationship Management</p>

</header>



<div class="container">



<div class="sidebar">


<h2>MENU</h2>


<a href="dashboard.html">
<button>🏠 Dashboard</button>
</a>


<a href="customers.html">
<button>👥 Customers</button>
</a>


<a href="ai_assistant.html">
<button>🤖 AI Assistant</button>
</a>

<button>📝 Marketing</button>
</a>


<a href="videos.html">
<button>🎥 Videos</button>
</a>


<a href="analytics.html">
<button>📊 Analytics</button>
</a>


<a href="reports.html">
<button>📄 Reports</button>
</a>


<a href="settings.html">
<button>⚙ Settings</button>
</a>


</div>



<div class="content">


<div class="card">


<h2>➕ Add New Customer</h2>


<label>
Customer Name
</label>


<input id="customerName"
placeholder="Enter customer name">



<label>
Phone Number
</label>


<input id="customerPhone"
placeholder="Enter phone number">



<label>
Location
</label>


<input id="customerLocation"
placeholder="Enter customer location">



<label>
Customer Message
</label>


<textarea id="customerMessage"
placeholder="Enter customer message"></textarea>



<br><br>


<button onclick="saveCustomer()">

Save Customer

</button>


                    </div>
                    <!-- CUSTOMER DATABASE -->

<div class="card">


<h2>👥 Customer History</h2>


<input 
id="searchCustomer"
placeholder="🔍 Search customer..."
onkeyup="searchCustomers()"
>



<br><br>


<div id="customerList">

<p>
No customer records loaded.
</p>


</div>


</div>



</div>

</div>


<script>


async function saveCustomer(){


let customer = {


name:
document.getElementById("customerName").value,


phone:
document.getElementById("customerPhone").value,


location:
document.getElementById("customerLocation").value,


message:
document.getElementById("customerMessage").value


};



if(customer.name=="" || customer.message==""){


alert("Please enter customer name and message.");

return;


}



let response =
await fetch(

"https://ai-business-manager.onrender.com/api/customers",

{


method:"POST",


headers:{


"Content-Type":"application/json"


},


body:JSON.stringify(customer)


}


);



let result =
await response.json();



alert("Customer saved successfully!");



document.getElementById("customerName").value="";

document.getElementById("customerPhone").value="";

document.getElementById("customerLocation").value="";

document.getElementById("customerMessage").value="";



loadCustomers();



}



async function loadCustomers(){


let response =
await fetch(

"https://ai-business-manager.onrender.com/api/customers"

);



let customers =
await response.json();



let area =
document.getElementById("customerList");



area.innerHTML="";


customers.forEach(function(customer){


area.innerHTML +=

`
<div class="card">


<h3>👤 ${customer.name}</h3>


<p>
<b>Message:</b><br>
${customer.message}
</p>


<p>
<b>🤖 AI Reply:</b><br>
${customer.ai_reply}
</p>


<p>
<b>Date:</b>
${customer.created_at}
</p>


<span class="status-online">
New Customer
</span>


</div>

`;



});



}



window.onload =
loadCustomers;
    <!-- CUSTOMER SEARCH -->

<script>


function searchCustomers(){


let input =
document
.getElementById("searchCustomer")
.value
.toLowerCase();



let cards =
document
.querySelectorAll("#customerList .card");



cards.forEach(function(card){


let text =
card.innerText.toLowerCase();



if(text.includes(input)){


card.style.display="block";


}

else{


card.style.display="none";


}


});



}



</script>



<script src="script.js"></script>


</body>

</html>
