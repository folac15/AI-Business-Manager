<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Management</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="topbar">

<h1>Customer Management</h1>

<p>Manage customer conversations with AI assistance</p>

</header>



<div class="container">


<div class="sidebar">

<h2>MENU</h2>


<a href="dashboard.html">
<button>🏠 Dashboard</button>
</a>


<a href="customers.html">
<button>👥 Customers</button>
</a>


<a href="ai_assistant.html">
<button>🤖 AI Assistant</button>
</a>


<a href="posts.html">
<button>📝 Posts</button>
</a>


<a href="videos.html">
<button>🎥 Videos</button>
</a>


<a href="post_history.html">
<button>📚 History</button>
</a>


<a href="settings.html">
<button>⚙ Settings</button>
</a>


</div>



<div class="content">


<div class="card">


<h2>Add Customer Message</h2>


<label>
Customer Name
</label>


<input
id="customerName"
placeholder="Enter customer name">



<br><br>



<label>
Customer Message
</label>


<textarea
id="customerMessage"
placeholder="Enter customer message">
</textarea>


<br><br>


<button onclick="saveCustomer()">

💾 Save Customer

</button>


<button onclick="loadCustomers()">

🔄 Load History

</button>


    </div>
    <div class="card">

<h2>Customer History</h2>

<div id="customerList">

<p>Loading customer records...</p>

</div>

</div>

</div>

</div>

<script>

async function saveCustomer(){

    let name =
    document.getElementById("customerName").value;

    let message =
    document.getElementById("customerMessage").value;

    if(name.trim()=="" || message.trim()==""){

        alert("Please enter the customer name and message.");

        return;

    }

    let response = await fetch(
    "https://ai-business-manager.onrender.com/api/customers",
    {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            name:name,
            message:message

        })

    });

    let result = await response.json();

    alert(result.ai_reply);

    document.getElementById("customerName").value="";
    document.getElementById("customerMessage").value="";
    }

   async function loadCustomers(){

    let response = await fetch(
    "https://ai-business-manager.onrender.com/api/customers"
    );

    let customers = await response.json();

    let area =
    document.getElementById("customerList");

    area.innerHTML = "";

    customers.forEach(function(customer){

        area.innerHTML +=

        "<div class='card'>" +

        "<h3>👤 " + customer.name + "</h3>" +

        "<p><b>Customer:</b><br>" +
        customer.message +
        "</p>" +

        "<p><b>🤖 AI Reply:</b><br>" +
        customer.ai_reply +
        "</p>" +

        "<p><small>" +
        customer.created_at +
        "</small></p>" +

        "</div>";

    });

}

window.onload = loadCustomers;

</script>

<script src="script.js"></script>

</body>

</html>
