<div class="content">


<div class="card">


<h2>🎧 Create Support Ticket</h2>


<label>
Customer Name
</label>


<input
type="text"
id="customerName"
placeholder="Enter customer name">



<label>
Issue Category
</label>


<select id="issueCategory">

<option>
Delivery Problem
</option>

<option>
Product Complaint
</option>

<option>
Payment Issue
</option>

<option>
Technical Issue
</option>

<option>
Other
</option>

</select>



<label>
Problem Description
</label>


<textarea
id="problemDescription"
placeholder="Describe the problem"></textarea>



<label>
Status
</label>


<select id="ticketStatus">

<option>
Open
</option>

<option>
In Progress
</option>

<option>
Resolved
</option>

</select>



<br><br>


<button id="saveTicket">

💾 Save Ticket

  </button>
  <div class="card">


<h2>📊 Support Summary</h2>


<p>

Total Tickets:

<b id="totalTickets">
0
</b>

</p>


</div>




<div class="card">


<h2>📚 Support Ticket History</h2>


<div id="ticketList">


<p>
No support tickets available yet.
</p>


</div>


</div>


</div>


  </div>
  <script>


const saveTicket =
document.getElementById("saveTicket");


const ticketList =
document.getElementById("ticketList");



function loadTickets(){


let tickets =
JSON.parse(localStorage.getItem("tickets")) || [];



document.getElementById("totalTickets").innerHTML =
tickets.length;



if(tickets.length === 0){


ticketList.innerHTML =
"<p>No support tickets available yet.</p>";

return;

}



ticketList.innerHTML = "";



tickets.reverse().forEach(function(ticket){


ticketList.innerHTML += `

<div class="card">


<h3>🎧 ${ticket.customer}</h3>


<p>
<b>Category:</b> ${ticket.category}
</p>


<p>
<b>Problem:</b> ${ticket.description}
</p>


<p>
<b>Status:</b> ${ticket.status}
</p>


<small>
${ticket.date}
</small>


</div>

`;

});


}



saveTicket.onclick = function(){



let ticket = {


customer:
document.getElementById("customerName").value.trim(),


category:
document.getElementById("issueCategory").value,


description:
document.getElementById("problemDescription").value.trim(),


status:
document.getElementById("ticketStatus").value,


date:
new Date().toLocaleString()


};



if(ticket.customer === "" || ticket.description === ""){


alert("Please fill customer name and problem description.");

return;

}



let tickets =
JSON.parse(localStorage.getItem("tickets")) || [];



tickets.push(ticket);



localStorage.setItem(
"tickets",
JSON.stringify(tickets)
);



alert("Support ticket saved successfully!");



loadTickets();



};



window.onload =
loadTickets;


</script>
