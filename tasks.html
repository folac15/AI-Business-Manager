<body>

<div class="content">


<div class="card">


<h2>📅 Create New Task</h2>


<label>
Task Title
</label>


<input
type="text"
id="taskTitle"
placeholder="Enter task title">



<label>
Description
</label>


<textarea
id="taskDescription"
placeholder="Describe the task"></textarea>



<label>
Assigned Employee
</label>


<input
type="text"
id="assignedEmployee"
placeholder="Employee name">



<label>
Priority
</label>


<select id="taskPriority">

<option>
High
</option>

<option>
Medium
</option>

<option>
Low
</option>

</select>



<label>
Status
</label>


<select id="taskStatus">

<option>
Pending
</option>

<option>
Completed
</option>

</select>



<br><br>


<button id="saveTask">

💾 Save Task

  </button>
  <div class="card">


<h2>📊 Task Summary</h2>


<p>

Total Tasks:

<b id="totalTasks">
0
</b>

</p>


<p>

Completed Tasks:

<b id="completedTasks">
0
</b>

</p>


<p>

Pending Tasks:

<b id="pendingTasks">
0
</b>

</p>


</div>




<div class="card">


<h2>📚 Task History</h2>


<div id="taskList">


<p>
No tasks created yet.
</p>


</div>


</div>


</div>


  </div>
  <script>


const saveTask =
document.getElementById("saveTask");


const taskList =
document.getElementById("taskList");



function loadTasks(){


let tasks =
JSON.parse(localStorage.getItem("tasks")) || [];


let completed = 0;

let pending = 0;



tasks.forEach(function(task){


if(task.status === "Completed"){

completed++;

}

else{

pending++;

}


});



document.getElementById("totalTasks").innerHTML =
tasks.length;


document.getElementById("completedTasks").innerHTML =
completed;


document.getElementById("pendingTasks").innerHTML =
pending;



if(tasks.length === 0){


taskList.innerHTML =
"<p>No tasks created yet.</p>";

return;

}



taskList.innerHTML = "";



tasks.reverse().forEach(function(task){


taskList.innerHTML += `

<div class="card">


<h3>📅 ${task.title}</h3>


<p>
<b>Description:</b> ${task.description}
</p>


<p>
<b>Assigned To:</b> ${task.employee}
</p>


<p>
<b>Priority:</b> ${task.priority}
</p>


<p>
<b>Status:</b> ${task.status}
</p>


<small>
${task.date}
</small>


</div>

`;

});


}



saveTask.onclick = function(){



let task = {


title:
document.getElementById("taskTitle").value.trim(),


description:
document.getElementById("taskDescription").value.trim(),


employee:
document.getElementById("assignedEmployee").value.trim(),


priority:
document.getElementById("taskPriority").value,


status:
document.getElementById("taskStatus").value,


date:
new Date().toLocaleString()


};



if(task.title === ""){


alert("Please enter task title.");

return;

}



let tasks =
JSON.parse(localStorage.getItem("tasks")) || [];



tasks.push(task);



localStorage.setItem(
"tasks",
JSON.stringify(tasks)
);



alert("Task saved successfully!");



loadTasks();



};



window.onload =
loadTasks;


</script>


<script src="script.js"></script>


</body>

  </html>
