<div class="content">


<div class="card">


<h2>📁 Add New Document</h2>


<label>
Document Title
</label>


<input
type="text"
id="documentTitle"
placeholder="Enter document title">



<label>
Category
</label>


<select id="documentCategory">

<option>
Invoice
</option>

<option>
Contract
</option>

<option>
Report
</option>

<option>
Certificate
</option>

<option>
Other
</option>

</select>



<label>
Description
</label>


<textarea
id="documentDescription"
placeholder="Enter document description"></textarea>



<br><br>


<button id="saveDocument">

💾 Save Document

  </button>
  <div class="card">


<h2>📊 Document Summary</h2>


<p>

Total Documents:

<b id="totalDocuments">
0
</b>

</p>


</div>




<div class="card">


<h2>📚 Document History</h2>


<div id="documentList">


<p>
No documents added yet.
</p>


</div>


</div>


</div>


  </div>
  <script>


const saveDocument =
document.getElementById("saveDocument");


const documentList =
document.getElementById("documentList");



function loadDocuments(){


let documents =
JSON.parse(localStorage.getItem("documents")) || [];



document.getElementById("totalDocuments").innerHTML =
documents.length;



if(documents.length === 0){


documentList.innerHTML =
"<p>No documents added yet.</p>";

return;

}



documentList.innerHTML = "";



documents.reverse().forEach(function(document){


documentList.innerHTML += `

<div class="card">


<h3>📁 ${document.title}</h3>


<p>
<b>Category:</b> ${document.category}
</p>


<p>
<b>Description:</b> ${document.description}
</p>


<small>
${document.date}
</small>


</div>

`;

});


}



saveDocument.onclick = function(){



let documentData = {


title:
document.getElementById("documentTitle").value.trim(),


category:
document.getElementById("documentCategory").value,


description:
document.getElementById("documentDescription").value.trim(),


date:
new Date().toLocaleString()


};



if(documentData.title === ""){


alert("Please enter document title.");

return;

}



let documents =
JSON.parse(localStorage.getItem("documents")) || [];



documents.push(documentData);



localStorage.setItem(
"documents",
JSON.stringify(documents)
);



alert("Document saved successfully!");



loadDocuments();



};



window.onload =
loadDocuments;


</script>


<script src="script.js"></script>
