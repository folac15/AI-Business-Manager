<div class="content">


<div class="card">


<h2>💰 Record New Sale</h2>


<label>
Customer Name
</label>


<input
type="text"
id="customerName"
placeholder="Enter customer name">



<label>
Product Name
</label>


<input
type="text"
id="productName"
placeholder="Enter product name">



<label>
Quantity Sold
</label>


<input
type="number"
id="saleQuantity"
placeholder="Enter quantity">



<label>
Selling Price
</label>


<input
type="number"
id="salePrice"
placeholder="Enter selling price">



<br><br>


<button id="saveSale">

💾 Save Sale

</button>


  </div>
  <div class="card">


<h2>📊 Sales Summary</h2>


<p>

Total Sales:

<b id="totalSales">
0
</b>

</p>


<p>

Total Revenue:

<b id="totalRevenue">
0
</b>

</p>


</div>




<div class="card">


<h2>📚 Sales History</h2>


<div id="salesList">


<p>
No sales recorded yet.
</p>


</div>


</div>


</div>


  </div>
  <script>

const saveSale =
document.getElementById("saveSale");


const salesList =
document.getElementById("salesList");



function loadSales(){


let sales =
JSON.parse(localStorage.getItem("sales")) || [];


let revenue = 0;


sales.forEach(function(sale){

revenue += Number(sale.price) * Number(sale.quantity);

});



document.getElementById("totalSales").innerHTML =
sales.length;



document.getElementById("totalRevenue").innerHTML =
revenue;



if(sales.length === 0){

salesList.innerHTML =
"<p>No sales recorded yet.</p>";

return;

}



salesList.innerHTML = "";



sales.reverse().forEach(function(sale){


salesList.innerHTML += `

<div class="card">

<h3>💰 ${sale.product}</h3>

<p>
<b>Customer:</b> ${sale.customer}
</p>

<p>
<b>Quantity:</b> ${sale.quantity}
</p>

<p>
<b>Selling Price:</b> ${sale.price}
</p>

<p>
<b>Total:</b> ${Number(sale.price) * Number(sale.quantity)}
</p>

<small>
${sale.date}
</small>

</div>

`;

});


}



saveSale.onclick = function(){



let sale = {


customer:
document.getElementById("customerName").value.trim(),


product:
document.getElementById("productName").value.trim(),


quantity:
document.getElementById("saleQuantity").value,


price:
document.getElementById("salePrice").value,


date:
new Date().toLocaleString()


};



if(
sale.customer === "" ||
sale.product === "" ||
sale.quantity === "" ||
sale.price === ""
){

alert("Please fill all sales fields.");

return;

}



let sales =
JSON.parse(localStorage.getItem("sales")) || [];



sales.push(sale);



localStorage.setItem(
"sales",
JSON.stringify(sales)
);



alert("Sale saved successfully!");



loadSales();



};



window.onload =
loadSales;


</script>


<script src="script.js"></script>
