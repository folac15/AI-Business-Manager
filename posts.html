<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marketing Manager</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="topbar">

<h1>AI Business Manager</h1>

<p>Marketing Content Manager</p>

</header>



<div class="container">


<div class="sidebar">


<h2>MENU</h2>


<a href="dashboard.html">
<button>🏠 Dashboard</button>
</a>


<a href="customers.html">
<button>👥 Customers</button>
</a>


<a href="ai_assistant.html">
<button>🤖 AI Assistant</button>
</a>


<a href="posts.html">
<button>📝 Marketing</button>
</a>


<a href="videos.html">
<button>🎥 Videos</button>
</a>


<a href="analytics.html">
<button>📊 Analytics</button>
</a>


<a href="settings.html">
<button>⚙ Settings</button>
</a>


</div>



<div class="content">


<div class="card">


<h2>📝 Create Marketing Post</h2>


<textarea
id="postInput"
rows="5"
placeholder="Example: Advertise my poultry farm, school, shop or product">
</textarea>


<br><br>


<button id="generateButton">

🤖 Generate Post

</button>


  </div>
  <!-- GENERATED POST -->


<div class="card">


<h2>✨ Generated Marketing Post</h2>


<textarea
id="generatedPost"
rows="8"
placeholder="Generated content will appear here...">
</textarea>


<br><br>


<button id="saveButton">

💾 Save Post

</button>


</div>




<!-- POST HISTORY -->


<div class="card">


<h2>📚 Saved Posts</h2>


<div id="postList">


<p>
No saved posts yet.
</p>


</div>


</div>


</div>


  </div>
  <script>


const postInput =
document.getElementById("postInput");


const generatedPost =
document.getElementById("generatedPost");


const postList =
document.getElementById("postList");



document
.getElementById("generateButton")
.onclick = function(){


let request =
postInput.value.toLowerCase().trim();



let result = "";



if(request.includes("poultry") || request.includes("chicken")){


result =
"🐔 Fresh quality chickens available! Healthy birds raised with care. Affordable prices and reliable service. Contact us today for orders and delivery.";


}

else if(request.includes("school") || request.includes("education")){


result =
"📚 Give your child quality education with experienced teachers and excellent learning support. Enrollment is open today.";


}

else if(request.includes("shop") || request.includes("product")){


result =
"✨ Quality products at affordable prices. We provide excellent service and customer satisfaction. Contact us today.";


}

else{


result =
"🚀 Discover our quality products and services. We are ready to serve you. Contact us today for more information.";


}



generatedPost.value = result;



};



document
.getElementById("saveButton")
.onclick = function(){


let post =
generatedPost.value.trim();



if(post===""){


alert("Please generate a post first.");

return;


}



let posts =
JSON.parse(
localStorage.getItem("posts")
)
||
[];



posts.push({

content: post,

date: new Date().toLocaleString()

});



localStorage.setItem(
"posts",
JSON.stringify(posts)
);



alert("Post saved successfully!");



loadPosts();



};



function loadPosts(){


let posts =
JSON.parse(
localStorage.getItem("posts")
)
||
[];



if(posts.length===0){


postList.innerHTML =
"No saved posts yet.";

return;


}



postList.innerHTML="";



posts.reverse().forEach(function(post,index){



postList.innerHTML += `

<div class="card">

<h3>
Post ${index+1}
</h3>

<p>
${post.content}
</p>

<small>
${post.date}
</small>

</div>

`;



});



}



loadPosts();



</script>



<script src="script.js"></script>


</body>

  </html>
