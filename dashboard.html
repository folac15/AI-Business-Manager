<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NexaFlow AI Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    background:#f4f7fb;
    min-height:100vh;
}


/* SIDEBAR */

.sidebar{

    width:250px;
    background:#0b1f3a;
    color:white;
    min-height:100vh;
    padding:25px;

}


.logo{

    font-size:22px;
    font-weight:bold;
    margin-bottom:35px;

}


.business-logo{

    width:70px;
    height:70px;

    background:white;
    color:#0b1f3a;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:15px;

    font-size:30px;

}


.sidebar a{

    display:block;

    color:white;

    text-decoration:none;

    padding:12px;

    margin-bottom:8px;

    border-radius:8px;

}


.sidebar a:hover{

    background:#0066ff;

}


.sidebar h3{

    word-break:break-word;

}



/* MAIN */

.main{

    flex:1;

    padding:30px;

}



/* HEADER */

.header{

    background:white;

    padding:20px;

    border-radius:12px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:20px;

}


.profile{

    font-weight:bold;

}



/* CARDS */

.cards{

    display:flex;

    gap:20px;

    flex-wrap:wrap;

    margin-top:30px;

}



.card{

    background:white;

    padding:25px;

    border-radius:12px;

    flex:1;

    min-width:220px;

    box-shadow:0 3px 10px rgba(0,0,0,0.08);

}


.card h3{

    margin-bottom:10px;

}


.card p{

    font-size:28px;

    font-weight:bold;

    color:#0066ff;

}



/* QUICK ACTIONS */

.actions{

    margin-top:30px;

    background:white;

    padding:25px;

    border-radius:12px;

}


button{

    padding:12px 20px;

    margin:10px;

    border:none;

    border-radius:8px;

    background:#0066ff;

    color:white;

    cursor:pointer;

}


button:hover{

    background:#004ccc;

}


/* STATUS */

.dashboard-status{

    margin-top:15px;

    font-size:14px;

    color:#666;

}



/* MOBILE */

@media(max-width:800px){

    body{

        display:flex;

    }


    .sidebar{

        width:85px;

        min-height:100vh;

        padding:12px;

    }


    .logo{

        font-size:16px;

    }


    .business-logo{

        width:45px;

        height:45px;

        font-size:20px;

    }


    .sidebar h3{

        display:none;

    }


    .sidebar a{

        font-size:12px;

        padding:8px;

    }


    .main{

        flex:1;

        padding:15px;

    }


    .header{

        flex-direction:column;

        align-items:flex-start;

    }

}


</style>

</head>


<body>


<script src="auth_guard.js"></script>


<!-- SIDEBAR -->

<div class="sidebar">


<div class="logo">

NexaFlow AI

</div>


<div class="business-logo">

🏢

</div>


<h3 id="businessName">

Your Business

</h3>


<br>


<a href="dashboard.html">
Dashboard
</a>


<a href="ai-assistant.html">
AI Assistant
</a>


<a href="customers.html">
Customers
</a>


<a href="analytics.html">
Analytics
</a>


<a href="automation.html">
Automation
</a>


<a href="reports.html">
Reports
</a>


<a href="settings.html">
Settings
</a>


    </div>
    <!-- MAIN CONTENT -->

<div class="main">


<div class="header">


<h2>
Business Dashboard
</h2>


<div
class="profile"
id="profileName">

Welcome Back

</div>


</div>



<div
id="dashboardStatus"
class="dashboard-status">

Loading dashboard information...

</div>



<div class="cards">


<div class="card">

<h3>
Customers
</h3>

<p id="customerCount">
0
</p>

</div>



<div class="card">

<h3>
AI Conversations
</h3>

<p id="conversationCount">
0
</p>

</div>



<div class="card">

<h3>
Reports
</h3>

<p id="reportCount">
0
</p>

</div>



<div class="card">

<h3>
Automation
</h3>

<p id="automationStatus">
Inactive
</p>

</div>



</div>




<div class="actions">


<h3>
Quick Actions
</h3>



<button onclick="openAI()">

Open AI Assistant

</button>



<button onclick="openCustomers()">

Manage Customers

</button>



<button onclick="openReports()">

View Reports

</button>



</div>


</div>





<script>


/* =====================================================
   LOAD BUSINESS INFORMATION
===================================================== */


async function loadBusinessInformation(){


const token =
localStorage.getItem(
"access_token"
);



const status =
document.getElementById(
"dashboardStatus"
);



if(!token){

window.location.href =
"login.html";

return;

}



try{


const response =
await fetch(

"/api/business",

{

method:"GET",

headers:{

"Authorization":
"Bearer " + token

}

}

);



const result =
await response.json();



if(response.status === 401){


localStorage.clear();


window.location.href =
"login.html";


return;


}



if(!response.ok){


status.textContent =
"Unable to load business information.";


return;


}



if(result.business){


const business =
result.business;



if(business.business_name){


document.getElementById(
"businessName"
).textContent =
business.business_name;


}



const profile =
document.getElementById(
"profileName"
);



if(business.owner_name){


profile.textContent =
"Welcome, " +
business.owner_name;


}
else{


profile.textContent =
"Welcome, " +
business.business_name;


}



if(business.id){


localStorage.setItem(
"business_id",
business.id
);


}



status.textContent =
"Dashboard loaded successfully.";


}



}catch(error){


console.error(
"Business loading error:",
error
);



status.textContent =
"Unable to connect to business service.";


}



}





/* =====================================================
   LOAD CUSTOMER STATISTICS
===================================================== */


async function loadCustomerStatistics(){


const token =
localStorage.getItem(
"access_token"
);



try{


const response =
await fetch(

"/api/customers",

{

method:"GET",

headers:{

"Authorization":
"Bearer " + token

}

}

);



const customers =
await response.json();



if(Array.isArray(customers)){


document.getElementById(
"customerCount"
).textContent =
customers.length;


}


}catch(error){


console.error(
"Customer statistics error:",
error
);


}



}
    


/* =====================================================
   DASHBOARD PLACEHOLDER STATISTICS
===================================================== */


function loadAdditionalStatistics(){


/*
   These modules will be connected
   to their backend routes as they
   are developed.
*/


document.getElementById(
"conversationCount"
).textContent =
"0";



document.getElementById(
"reportCount"
).textContent =
"0";



document.getElementById(
"automationStatus"
).textContent =
"Inactive";


}




/* =====================================================
   QUICK ACTIONS
===================================================== */


function openAI(){

window.location.href =
"ai-assistant.html";

}



function openCustomers(){

window.location.href =
"customers.html";

}



function openReports(){

window.location.href =
"reports.html";

}





/* =====================================================
   START DASHBOARD
===================================================== */


window.addEventListener(
"load",
function(){


loadBusinessInformation();


loadCustomerStatistics();


loadAdditionalStatistics();



}

);



</script>


</body>

</html>
