content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="topbar">

<h1>AI Business Manager</h1>

<p>Professional Business Dashboard</p>

</header>

<div class="container">

<div class="sidebar">

<h2>MENU</h2>

<a href="dashboard.html">
<button>🏠 Dashboard</button>
</a>

<a href="customers.html">
<button>👥 Customers</button>

</a>

<button>📚 Post History</button>
</a>

<a href="settings.html">
<button>⚙ Settings</button>
</a>

</div>

<div class="content">

<h2>Dashboard Overview</h2>

<div class="dashboard-grid">

<div class="dashboard-card">

<h3>👥 Customers</h3>

<h1 id="customerCount">0</h1>

<p>Total Customers</p>

</div>

<div class="dashboard-card">

<h3>🤖 AI Replies</h3>

<h1>100%</h1>

<p>Automatic Response</p>

</div>

<div class="dashboard-card">

<h3>📹 Videos</h3>

<h1>0</h1>

<p>Marketing Videos</p>

</div>

<div class="dashboard-card">

<h3>📝 Posts</h3>

<h1>0</h1>

<p>Saved Posts</p>

</div>
  <div class="dashboard-card">

<h3>💰 Revenue</h3>

<h1>0 FCFA</h1>

<p>Business Revenue</p>

</div>

</div>

<br>

<div class="card">

<h2>Recent Activity</h2>

<div id="recentActivity">

<p>Loading business information...</p>

</div>

</div>

</div>

</div>

<script>

async function loadDashboard(){

try{

let response = await fetch(
"https://ai-business-manager.onrender.com/api/customers"
);

let customers = await response.json();

document.getElementById("customerCount").innerHTML =
customers.length;

let activity =
document.getElementById("recentActivity");

activity.innerHTML = "";

customers.slice().reverse().forEach(function(customer){

activity.innerHTML +=

"<p><b>"+customer.name+"</b> : "
+customer.message+
"<br><small>"
+customer.created_at+
"</small></p><hr>";

});

}

catch(error){

document.getElementById("recentActivity").innerHTML =
"Unable to load dashboard data.";

console.log(error);

}

}

window.onload = loadDashboard;

</script>

<script src="script.js"></script>

</body>

</html>
