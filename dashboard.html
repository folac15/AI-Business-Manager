<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NexaFlow AI Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    display:flex;
    background:#f4f7fb;
    min-height:100vh;
}


/* SIDEBAR */

.sidebar{

    width:250px;
    background:#0b1f3a;
    color:white;
    min-height:100vh;
    padding:25px;

}


.logo{

    font-size:22px;
    font-weight:bold;
    margin-bottom:35px;

}


.business-logo{

    width:70px;
    height:70px;
    background:white;
    color:#0b1f3a;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:15px;
    font-size:30px;

}


.sidebar a{

    display:block;
    color:white;
    text-decoration:none;
    padding:12px;
    margin-bottom:8px;
    border-radius:8px;

}


.sidebar a:hover{

    background:#0066ff;

}


/* MAIN */

.main{

    flex:1;
    padding:30px;

}


/* HEADER */

.header{

    background:white;
    padding:20px;
    border-radius:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;

}


.profile{

    font-weight:bold;

}


/* CARDS */

.cards{

    display:flex;
    gap:20px;
    flex-wrap:wrap;
    margin-top:30px;

}


.card{

    background:white;
    padding:25px;
    border-radius:12px;
    flex:1;
    min-width:220px;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);

}


.card h3{

    margin-bottom:10px;

}


/* QUICK ACTIONS */

.actions{

    margin-top:30px;
    background:white;
    padding:25px;
    border-radius:12px;

}


button{

    padding:12px 20px;
    margin:10px;
    border:none;
    border-radius:8px;
    background:#0066ff;
    color:white;
    cursor:pointer;

}


button:hover{

    background:#004ccc;

}


/* MOBILE */

@media(max-width:800px){

body{
    display:flex;
}

.sidebar{
    width:85px;
    min-height:100vh;
    padding:12px;
}

.logo{
    font-size:16px;
}

.business-logo{
    width:45px;
    height:45px;
    font-size:20px;
}

.sidebar h3{
    display:none;
}

.sidebar a{
    font-size:12px;
    padding:8px;
}

.main{
    flex:1;
    padding:15px;
}

.ai-box{
    max-width:100%;
}

    }


</style>

</head>


<body>
    <script src="auth_guard.js"></script>
