</head>


<body>


<header class="topbar">

<h1>AI Business Manager</h1>

<p>Business Control Dashboard</p>

</header>



<div class="container">


<div class="sidebar">

<h2>MENU</h2>


<a href="dashboard.html">
<button>🏠 Dashboard</button>
</a>

</a>

</a>

<button>📚 History</button>
</a>

<button>⚙ Settings</button>
</a>


</div>



<div class="content">


<h2>Business Overview</h2>


<div class="dashboard-grid">


<div class="dashboard-card">

<h3>👥 Customers</h3>

<h1 id="customerCount">0</h1>

<p>Total Customers</p>

</div>


<div class="dashboard-card">

<h3>🤖 AI Replies</h3>

<h1 id="aiCount">0</h1>

<p>Automatic Responses</p>

</div>


<div class="dashboard-card">

<h3>📝 Posts</h3>

<h1 id="postCount">0</h1>

<p>Marketing Posts</p>

  </div>
  <div class="dashboard-card">

<h3>📹 Videos</h3>

<h1 id="videoCount">0</h1>

<p>Business Videos</p>

</div>


</div>


<br>


<div class="card">

<h2>Quick Actions</h2>


<a href="customers.html">

<button>
➕ Add Customer
</button>

</a>


<a href="ai_assistant.html">

<button>
🤖 Ask AI
</button>

</a>


<a href="posts.html">

<button>
📝 Create Post
</button>

</a>


</div>



<div class="card">


<h2>Recent Customer Activity</h2>


<div id="recentActivity">

<p>
Loading customer activity...
</p>


</div>


  </div>
  <script>

async function loadDashboard(){


try{


let response = await fetch(
"https://ai-business-manager.onrender.com/api/customers"
);


let customers = await response.json();



document.getElementById("customerCount").innerHTML =
customers.length;



document.getElementById("aiCount").innerHTML =
customers.filter(function(customer){

return customer.ai_reply;

}).length;



let activity =
document.getElementById("recentActivity");



activity.innerHTML = "";



customers.slice(0,5).forEach(function(customer){


activity.innerHTML +=

"<p><b>"
+ customer.name +
"</b><br>"
+ customer.message +
"<br><small>"
+ customer.created_at +
"</small></p><hr>";


});


}



catch(error){


document.getElementById("recentActivity").innerHTML =
"Unable to load customer activity.";


console.log(error);


}


}



window.onload = loadDashboard;


</script>



<script src="script.js"></script>


</body>

  </html>
