<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NexaFlow AI Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    background:#f4f7fb;
    min-height:100vh;
}

/* SIDEBAR */

.sidebar{
    width:250px;
    background:#0b1f3a;
    color:white;
    min-height:100vh;
    padding:25px;
}

.logo{
    font-size:22px;
    font-weight:bold;
    margin-bottom:35px;
}

.business-logo{
    width:70px;
    height:70px;
    background:white;
    color:#0b1f3a;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:15px;
    font-size:30px;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:12px;
    margin-bottom:8px;
    border-radius:8px;
}

.sidebar a:hover{
    background:#0066ff;
}

.sidebar h3{
    word-break:break-word;
}

/* MAIN */

.main{
    flex:1;
    padding:30px;
}

/* HEADER */

.header{
    background:white;
    padding:20px;
    border-radius:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.profile{
    font-weight:bold;
}

/* CARDS */

.cards{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    margin-top:30px;
}

.card{
    background:white;
    padding:25px;
    border-radius:12px;
    flex:1;
    min-width:220px;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.card h3{
    margin-bottom:10px;
}

/* QUICK ACTIONS */

.actions{
    margin-top:30px;
    background:white;
    padding:25px;
    border-radius:12px;
}

button{
    padding:12px 20px;
    margin:10px;
    border:none;
    border-radius:8px;
    background:#0066ff;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#004ccc;
}

.logout-button{
    width:100%;
    padding:12px;
    background:#e53935;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    margin:0;
}

/* STATUS */

.dashboard-status{
    margin-top:15px;
    font-size:14px;
    color:#666;
}

/* MOBILE */

@media(max-width:800px){

    body{
        display:flex;
    }

    .sidebar{
        width:85px;
        min-height:100vh;
        padding:12px;
    }

    .logo{
        font-size:16px;
    }

    .business-logo{
        width:45px;
        height:45px;
        font-size:20px;
    }

    .sidebar h3{
        display:none;
    }

    .sidebar a{
        font-size:12px;
        padding:8px;
    }

    .main{
        flex:1;
        padding:15px;
    }

    .header{
        flex-direction:column;
        align-items:flex-start;
    }

}

</style>

</head>

<body>

<script src="auth_guard.js"></script>


<!-- =====================================================
     SIDEBAR
===================================================== -->

<div class="sidebar">

    <div class="logo">
        NexaFlow AI
    </div>

    <div class="business-logo">
        🏢
    </div>

    <h3 id="businessName">
        Your Business
    </h3>

    <br>

    <a href="dashboard.html">
        Dashboard
    </a>

    <a href="ai-assistant.html">
        AI Assistant
    </a>

    <a href="customers.html">
        Customers
    </a>

    <a href="analytics.html">
        Analytics
    </a>

    <a href="automation.html">
        Automation
    </a>

    <a href="reports.html">
        Reports
    </a>

    <a href="settings.html">
        Settings
    </a>

    <a href="index.html">
        Logout
    </a>

    <hr style="margin:20px 0;">

    <button
        onclick="logout()"
        class="logout-button">

        🚪 Logout

    </button>

</div>


<!-- =====================================================
     MAIN CONTENT
===================================================== -->

<div class="main">

    <div class="header">

        <h2>
            Business Dashboard
        </h2>

        <div
            class="profile"
            id="profileName">

            Welcome Back

        </div>

    </div>


    <div
        id="dashboardStatus"
        class="dashboard-status">

        Loading business information...

    </div>


    <div class="cards">


        <div class="card">

            <h3>
                Customers
            </h3>

            <p>
                0
            </p>

        </div>


        <div class="card">

            <h3>
                AI Conversations
            </h3>

            <p>
                0
            </p>

        </div>


        <div class="card">

            <h3>
                Reports
            </h3>

            <p>
                0
            </p>

        </div>


        <div class="card">

            <h3>
                Automation
            </h3>

            <p>
                Inactive
            </p>

        </div>


    </div>


    <div class="actions">

        <h3>
            Quick Actions
        </h3>


        <button onclick="openAI()">

            Open AI Assistant

        </button>


        <button onclick="openCustomers()">

            Manage Customers

        </button>


        <button onclick="openReports()">

            View Reports

        </button>

    </div>

</div>


<script>

/* =====================================================
   LOAD BUSINESS INFORMATION
===================================================== */

async function loadBusinessInformation(){

    const token =
        localStorage.getItem("access_token");


    const status =
        document.getElementById(
            "dashboardStatus"
        );


    if(!token){

        window.location.href =
            "login.html";

        return;

    }


    try{

        /*
        IMPORTANT:

        We use the Flask backend instead of
        querying Supabase directly.

        This is the same authentication
        method already working on Customers.
        */

        const response =
            await fetch(

                "/api/business",

                {

                    method:"GET",

                    headers:{

                        "Authorization":
                            "Bearer " + token

                    }

                }

            );


        const result =
            await response.json();


        console.log(
            "Dashboard business response:",
            result
        );


        /* =================================================
           SESSION ERROR
        ================================================= */

        if(response.status === 401){

            localStorage.removeItem(
                "access_token"
            );

            localStorage.removeItem(
                "refresh_token"
            );

            localStorage.removeItem(
                "user_id"
            );

            localStorage.removeItem(
                "business_id"
            );

            window.location.href =
                "login.html";

            return;

        }


        /* =================================================
           OTHER SERVER ERROR
        ================================================= */

        if(!response.ok){

            console.error(
                "Business loading error:",
                result
            );

            status.textContent =
                "Unable to load business information.";

            return;

        }


        /* =================================================
           NO BUSINESS ACCOUNT
        ================================================= */

        if(
            !result.business
        ){

            status.textContent =
                "Business profile not found.";

            console.warn(
                "No business profile was returned."
            );

            return;

        }


        const business =
            result.business;


        /* =================================================
           BUSINESS NAME
        ================================================= */

        const businessName =
            document.getElementById(
                "businessName"
            );


        if(
            businessName &&
            business.business_name
        ){

            businessName.textContent =
                business.business_name;

        }


        /* =================================================
           OWNER NAME
        ================================================= */

        const profileName =
            document.getElementById(
                "profileName"
            );


        if(
            profileName &&
            business.owner_name
        ){

            profileName.textContent =
                "Welcome, " +
                business.owner_name;

        }else if(
            profileName &&
            business.business_name
        ){

            profileName.textContent =
                "Welcome, " +
                business.business_name;

        }


        /* =================================================
           SAVE BUSINESS ID
        ================================================= */

        if(business.id){

            localStorage.setItem(
                "business_id",
                business.id
            );

        }


        status.textContent =
            "Business profile loaded successfully.";


        console.log(
            "Business loaded successfully:",
            business
        );


    }catch(error){

        console.error(
            "Dashboard business connection error:",
            error
        );


        status.textContent =
            "Unable to connect to the business service.";

    }

}


/* =====================================================
   QUICK ACTIONS
===================================================== */

function openAI(){

    window.location.href =
        "ai-assistant.html";

}


function openCustomers(){

    window.location.href =
        "customers.html";

}


function openReports(){

    window.location.href =
        "reports.html";

}


/* =====================================================
   START DASHBOARD
===================================================== */

window.addEventListener(
    "load",
    function(){

        loadBusinessInformation();

    }
);

</script>


</body>

    </html>
