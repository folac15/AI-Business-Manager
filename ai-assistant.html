<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Assistant</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#f4f7fb;
display:flex;
min-height:100vh;

}


/* SIDEBAR */

.sidebar{

width:250px;
background:#0b1f3a;
color:white;
padding:25px;

}


.logo{

font-size:22px;
font-weight:bold;
margin-bottom:30px;

}


.business-logo{

width:70px;
height:70px;
background:white;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
color:#0b1f3a;
margin-bottom:15px;

}


.sidebar a{

display:block;
color:white;
text-decoration:none;
padding:12px;
margin-bottom:8px;
border-radius:8px;

}


.sidebar a:hover{

background:#0066ff;

}



/* MAIN */

.main{

flex:1;
padding:30px;

}



.header{

background:white;
padding:20px;
border-radius:12px;
margin-bottom:30px;

}



/* AI BOX */

.ai-box{

background:white;
padding:30px;
border-radius:12px;
max-width:800px;

}


textarea{

width:100%;
height:120px;
padding:15px;
margin-top:15px;
border-radius:8px;
border:1px solid #ddd;
font-size:16px;

}



button{

margin-top:15px;
padding:12px 25px;
background:#0066ff;
color:white;
border:none;
border-radius:8px;
cursor:pointer;

}


button:hover{

background:#004ccc;

}



.response{

margin-top:25px;
background:#f4f7fb;
padding:20px;
border-radius:10px;
min-height:100px;

}



@media(max-width:800px){

body{

display:block;

}

.sidebar{

width:100%;

}

.main{

padding:15px;

}

}


</style>


</head>



<body>



<div class="sidebar">


<div class="logo">

NexaFlow AI

</div>


<div class="business-logo">

🏢

</div>


<h3>
Your Business
</h3>


<br>


<a href="dashboard.html">
Dashboard
</a>


<a href="ai-assistant.html">
AI Assistant
</a>


<a href="customers.html">
Customers
</a>


<a href="analytics.html">
Analytics
</a>


<a href="automation.html">
Automation
</a>


<a href="reports.html">
Reports
</a>


<a href="settings.html">
Settings
</a>


</div>





<div class="main">



<div class="header">

<h2>
🤖 AI Business Assistant
</h2>

<p>
Ask questions and get intelligent business support.
</p>

</div>





<div class="ai-box">


<h3>
Chat with AI
</h3>


<textarea 
id="question"
placeholder="Example: How can I increase my sales?">
</textarea>



<button onclick="askAI()">

Ask AI

</button>



<div class="response" id="answer">

AI answer will appear here.

</div>



</div>



</div>






<script>


async function askAI(){


let question =
document.getElementById("question").value;



if(question.trim()==""){

alert("Please enter a question");

return;

}



document.getElementById("answer").innerHTML =
"AI is thinking...";



try{


let response = await fetch("/api/ai",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

question:question

})

});



let data = await response.json();



document.getElementById("answer").innerHTML =

"<b>AI Answer:</b><br><br>" +

data.answer;



}



catch(error){


document.getElementById("answer").innerHTML =

"AI connection error: " + error;


}



}

window.onload = function(){
    window.scrollTo(0,0);
};

</script>



</body>

  </html>
