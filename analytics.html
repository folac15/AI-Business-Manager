<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NexaFlow AI - Analytics</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

display:flex;
background:#f4f7fb;
min-height:100vh;

}


/* SIDEBAR */

.sidebar{

width:250px;
background:#0b1f3a;
color:white;
padding:25px;
min-height:100vh;

}


.logo{

font-size:22px;
font-weight:bold;
margin-bottom:30px;

}


.business-logo{

width:70px;
height:70px;
background:white;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
color:#0b1f3a;
margin-bottom:15px;

}


.sidebar h3{

word-break:break-word;

}


.sidebar a{

display:block;
color:white;
text-decoration:none;
padding:12px;
margin-bottom:8px;
border-radius:8px;

}


.sidebar a:hover{

background:#0066ff;

}



/* MAIN */

.main{

flex:1;
padding:30px;

}



/* HEADER */

.header{

background:white;
padding:20px;
border-radius:12px;
margin-bottom:30px;

}



/* ANALYTICS CARDS */

.analytics-grid{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;

}


.card{

background:white;
padding:25px;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,0.08);

}


.card h3{

margin-bottom:15px;

}


.number{

font-size:35px;
font-weight:bold;
color:#0066ff;

}



/* ACTIVITY */

.activity{

margin-top:30px;
background:white;
padding:25px;
border-radius:12px;

}


.activity-item{

background:#f4f7fb;
padding:15px;
margin-top:12px;
border-radius:8px;

}


.loading{

color:#666;
padding:15px;

}


.error{

background:#fff0f0;
color:#c62828;
padding:15px;
border-radius:8px;

}


.empty{

color:#666;
padding:15px;

}



/* MOBILE */

@media(max-width:800px){


.sidebar{

width:85px;
padding:12px;

}


.logo{

font-size:16px;

}


.business-logo{

width:45px;
height:45px;
font-size:20px;

}


.sidebar h3{

display:none;

}


.sidebar a{

font-size:12px;
padding:8px;

}


.main{

padding:15px;

}


.analytics-grid{

grid-template-columns:1fr;

}


}


</style>


</head>


<body>


<script src="auth_guard.js"></script>



<div class="sidebar">


<div class="logo">

NexaFlow AI

</div>



<div class="business-logo">

📊

</div>



<h3 id="businessName">

Your Business

</h3>



<br>



<a href="dashboard.html">
Dashboard
</a>


<a href="ai-assistant.html">
AI Assistant
</a>


<a href="customers.html">
Customers
</a>


<a href="analytics.html">
Analytics
</a>


<a href="automation.html">
Automation
</a>


<a href="reports.html">
Reports
</a>


<a href="settings.html">
Settings
</a>


</div>



<div class="main">


<div class="header">


<h2>
📊 Business Analytics
</h2>


<p>
Monitor your business performance.
</p>


</div>


<div class="analytics-grid">


<div class="card">

<h3>
Customers
</h3>

<div class="number" id="customerTotal">
0
</div>

</div>



<div class="card">

<h3>
AI Conversations
</h3>

<div class="number" id="aiTotal">
0
</div>

</div>



<div class="card">

<h3>
Messages
</h3>

<div class="number" id="messageTotal">
0
</div>

</div>



<div class="card">

<h3>
Automation
</h3>

<div class="number">
ON
</div>

</div>



</div>


<div class="activity">


<h3>
Recent Customer Activity
</h3>


<div id="activityList">

Loading activity...

</div>


  </div>
  
<script>


/* =====================================================
   LOAD BUSINESS NAME
===================================================== */


async function loadBusiness(){


const token =
localStorage.getItem(
"access_token"
);



if(!token){

return;

}



try{


const response =
await fetch(

"/api/business",

{

method:"GET",

headers:{

"Authorization":
"Bearer " + token

}

}

);



const result =
await response.json();



if(response.status === 401){

localStorage.removeItem(
"access_token"
);

window.location.href =
"login.html";

return;

}



if(
result.business &&
result.business.business_name
){


document.getElementById(
"businessName"
).textContent =
result.business.business_name;


}



}catch(error){


console.error(
"Business loading error:",
error
);


}


}





/* =====================================================
   LOAD ANALYTICS DATA
===================================================== */


async function loadAnalytics(){


const activity =
document.getElementById(
"activityList"
);



const token =
localStorage.getItem(
"access_token"
);



if(!token){


activity.innerHTML =
'<div class="error">Login session unavailable.</div>';

return;


}



try{


const response =
await fetch(

"/api/customers",

{

method:"GET",

headers:{

"Authorization":
"Bearer " + token

}

}

);



const customers =
await response.json();



if(response.status === 401){


localStorage.removeItem(
"access_token"
);


window.location.href =
"login.html";


return;


}




if(!response.ok || !Array.isArray(customers)){


activity.innerHTML =
'<div class="error">Unable to load analytics data.</div>';


return;


}




/* TOTAL CUSTOMERS */


document.getElementById(
"customerTotal"
).textContent =
customers.length;





/* TOTAL MESSAGES */


document.getElementById(
"messageTotal"
).textContent =
customers.length;






/* AI CONVERSATIONS */


let aiCount = 0;



customers.forEach(
function(customer){


if(
customer.ai_reply &&
customer.ai_reply.trim() !== ""
){


aiCount++;


}


}

);



document.getElementById(
"aiTotal"
).textContent =
aiCount;






/* RECENT ACTIVITY */


if(customers.length === 0){


activity.innerHTML =
'<div class="empty">No customer activity available.</div>';


return;


}



let html = "";



customers.slice(0,10).forEach(
function(customer){



html += `


<div class="activity-item">


<b>
Customer:
</b>

${escapeHtml(customer.name || "Unknown")}


<br><br>


<b>
Message:
</b>


<br>

${escapeHtml(customer.message || "")}



<br><br>



<b>
AI Reply:
</b>


<br>


${escapeHtml(customer.ai_reply || "No AI reply yet.")}



<br><br>


<small>

${escapeHtml(customer.created_at || "")}

</small>



</div>



`;



});



activity.innerHTML =
html;




}catch(error){


console.error(
"Analytics error:",
error
);


activity.innerHTML =
'<div class="error">Connection error while loading analytics.</div>';


}



}






/* =====================================================
   HTML SECURITY
===================================================== */


function escapeHtml(value){


return String(value)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);


}





/* =====================================================
   PAGE START
===================================================== */


window.addEventListener(
"load",
function(){


loadBusiness();


loadAnalytics();



});


  </script>
  
</div>


</div>


</body>


  </html>
